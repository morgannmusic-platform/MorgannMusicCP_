<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Modifier l'artiste invité | Morgann Music CP</title>
    <link rel="stylesheet" href="js/reponsive.css">
    <meta name="theme-color" content="">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            margin: 4rem 0 0 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-primary {
            background: #FC8FB0;
            color: white;
        }

        .btn-secondary {
            background: #fff7fa;
            color: #FC8FB0;
            border: 2px solid #FC8FB0;
        }

        .form-section {
            border-bottom: 1px solid #FC8FB0;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .form-section h3 {
            margin-top: 0;
            color: #495057;
            font-size: 16px;
            border-left: 4px solid #FC8FB0;
            padding-left: 8px;
            border-radius: 3px;
        }

        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #444;
        }

        .form-group input {
            padding: 8px;
            border: 1px solid #FC8FB0;
            border-radius: 50px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div id="navbar-container"></div>
    <script type="module" src="js/navbar.js"></script>
    <div id="sidebar-container"></div>
    <script src="js/sidebar.js"></script>
    <div class="main-content">

        <div class="container">
            <div class="header-actions">
                <h2>Modifier l'Artiste Invité</h2>
                <a href="artistes.html" class="btn btn-secondary">Retour à la liste</a>
            </div>

            <div class="modal-content"
                style="width: 100%; max-width: 100%; box-sizing: border-box; background-color: rgba(232, 232, 232, 0.50); backdrop-filter: blur(62px); -webkit-backdrop-filter: blur(62px); border: 1px solid rgba(189, 189, 189, 0.438); border-radius: 34px; box-shadow: 0 0 22px rgba(0, 0, 0, 0.385); padding: 30px;">
                <form id="invite-form" onsubmit="soumettreFormulaire(event)">
                    <input type="hidden" id="artist-id">

                    <div class="form-section">
                        <h3>Informations de l'artiste invité</h3>
                        <div class="form-group">
                            <label>Nom de l'artiste (Nom de scène) *</label>
                            <input type="text" id="artist-name" required>
                        </div>
                        <div class="form-group">
                            <label>Prénom *</label>
                            <input type="text" id="artist-firstname" required>
                        </div>
                        <div class="form-group">
                            <label>Nom de famille *</label>
                            <input type="text" id="artist-lastname" required>
                        </div>
                        <div class="form-group">
                            <label>Email *</label>
                            <input type="email" id="artist-email" required>
                        </div>
                    </div>

                    <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                        <a href="artistes.html" class="btn btn-secondary"
                            style="text-decoration: none; display: inline-flex; align-items: center;">Annuler</a>
                        <button type="submit" class="btn btn-primary">Enregistrer</button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script type="module">
        import { auth } from "/assets/js/firebase.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
        import { api } from "/assets/js/api.js";

        const urlParams = new URLSearchParams(window.location.search);
        const artistId = urlParams.get('id');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                if (artistId) {
                    await chargerDetailsInvite(artistId);
                } else {
                    alert("Aucun identifiant spécifié.");
                    window.location.href = "artistes.html";
                }
            } else {
                window.location.href = "login.html";
            }
        });

        async function chargerDetailsInvite(id) {
            try {
                const response = await api.get(`/api/artists-labels`);
                const allInvited = Array.isArray(response) ? response : [];
                const artist = allInvited.find(item => String(item.id) === String(id));

                if (artist) {
                    document.getElementById("artist-id").value = artist.id;
                    document.getElementById("artist-name").value = artist.artiste || "";
                    document.getElementById("artist-firstname").value = artist.prenom || "";
                    document.getElementById("artist-lastname").value = artist.nom || "";
                    document.getElementById("artist-email").value = artist.email || "";
                } else {
                    alert("Artiste invité introuvable.");
                    window.location.href = "artistes.html";
                }
            } catch (e) {
                console.error("Erreur chargement :", e);
                alert("Impossible de charger les détails de l'artiste.");
            }
        }

        window.soumettreFormulaire = async function (e) {
            e.preventDefault();
            const id = document.getElementById("artist-id").value;

            const payload = {
                artiste: document.getElementById("artist-name").value.trim(),
                prenom: document.getElementById("artist-firstname").value.trim(),
                nom: document.getElementById("artist-lastname").value.trim(),
                email: document.getElementById("artist-email").value.trim()
            };

            try {
                await api.put(`/api/artists-labels/${id}`, payload);
                alert("Modifications enregistrées avec succès !");
                window.location.href = "artistes.html";
            } catch (error) {
                console.error("Erreur sauvegarde :", error);
                alert("Erreur lors de la sauvegarde : " + (error.message || "Inconnue"));
            }
        };
    </script>
</body>

</html>

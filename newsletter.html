<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description"
        content="Inscrivez-vous à la newsletter Morgann Music CP pour recevoir les dernières actualités, annonces de sorties et mises à jour du label.">
    <meta name="theme-color" content="#FC8FB0" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#52303c" media="(prefers-color-scheme: dark)">

    <title>Newsletter | Morgann Music CP</title>
    <link rel="stylesheet" href="/assets/css/styles-accueil.css">
    <link rel="stylesheet" href="/assets/footers/accueil/footer.css">
    <link rel="icon" type="image/png" href="/assets/img/icons/clair.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script type="module" src="/assets/js/navbar.js" defer></script>
    <script src="/assets/footers/accueil/footer.js" defer></script>

    <style>
        .newsletter-hero {
            max-width: 680px;
            margin: 4rem auto 6rem;
            padding: 3rem 2rem;
            background: linear-gradient(145deg, var(--container1), var(--container3));
            border: 1px solid var(--border-subtle);
            border-radius: 36px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .newsletter-hero h1 {
            font-size: clamp(2rem, 3.5vw, 2.8rem);
            color: var(--rose);
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .newsletter-hero p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .newsletter-form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            text-align: left;
        }

        .newsletter-form label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--rose);
            font-weight: 600;
        }

        .newsletter-input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid var(--border-subtle);
            font-size: 1rem;
            color: inherit;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .newsletter-input:focus {
            border-color: var(--rose);
            background: #ffffff;
        }

        .newsletter-submit {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 2.5rem;
            background-color: var(--rose);
            color: var(--bg);
            border: none;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(252, 143, 176, 0.3);
            transition: transform 0.3s ease, background-color 0.3s ease;
            margin-top: 1rem;
        }

        .newsletter-submit:hover {
            transform: scale(1.02) translateY(-2px);
            background-color: #f6729a;
        }

        .newsletter-feedback {
            margin-top: 1.2rem;
            font-size: 0.95rem;
            font-weight: 500;
            min-height: 1.5rem;
        }

        .newsletter-feedback.success {
            color: #2e7d32;
        }

        .newsletter-feedback.error {
            color: #c62828;
        }
    </style>
</head>

<body>
    <div id="navbar"></div>

    <div class="content-wrapper">
        <main class="newsletter-hero">
            <span class="hero-panel-badge" style="margin-bottom: 1rem; display: inline-block;">Restez connectés</span>
            <h1>Rejoignez notre Newsletter</h1>
            <p>
                Recevez directement dans votre boîte mail les dernières actualités de Morgann Music CP, nos annonces de
                sorties exclusives et les conseils pour propulser votre carrière artistique.
            </p>

            <form id="public-newsletter-form" class="newsletter-form">
                <div>
                    <label for="subscriber-name">Votre Prénom</label>
                    <input type="text" id="subscriber-name" class="newsletter-input" placeholder="Ex: Alex" required>
                </div>
                <div>
                    <label for="subscriber-email">Votre Adresse E-mail</label>
                    <input type="email" id="subscriber-email" class="newsletter-input" placeholder="nom@exemple.com"
                        required>
                </div>
                <div style="display: flex; align-items: center; gap: 10px; margin-top: 0.5rem;">
                    <input type="checkbox" id="subscriber-consent"
                        style="width: 18px; height: 18px; accent-color: var(--rose); cursor: pointer;" required>
                    <label for="subscriber-consent"
                        style="text-transform: none; font-size: 0.85rem; color: var(--text-secondary); cursor: pointer;">
                        J'accepte de recevoir les e-mails et actualités de Morgann Music CP.
                    </label>
                </div>

                <div style="text-align: center;">
                    <button type="submit" class="newsletter-submit">S'inscrire à la newsletter</button>
                    <div id="newsletter-feedback" class="newsletter-feedback" role="status" aria-live="polite"></div>
                </div>
            </form>
        </main>
    </div>

    <div id="footer"></div>

    <script type="module">
        import { api } from "/assets/js/api.js";

        const form = document.getElementById("public-newsletter-form");
        const feedbackEl = document.getElementById("newsletter-feedback");

        form?.addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("subscriber-name").value.trim();
            const email = document.getElementById("subscriber-email").value.trim();

            if (!name || !email) {
                feedbackEl.textContent = "Veuillez remplir tous les champs obligatoires.";
                feedbackEl.className = "newsletter-feedback error";
                return;
            }

            feedbackEl.textContent = "Inscription en cours...";
            feedbackEl.className = "newsletter-feedback";

            try {
                // Appel de la route dédiée unique pour l'inscription à la newsletter
                await api.post("/api/newsletter/subscribe", {
                    name: name,
                    email: email
                });

                feedbackEl.textContent = "🎉 Inscription réussie ! Un e-mail de bienvenue vous a été envoyé.";
                feedbackEl.className = "newsletter-feedback success";
                form.reset();
            } catch (err) {
                console.error("Erreur inscription newsletter :", err);
                feedbackEl.textContent = "Une erreur est survenue. Veuillez réessayer ultérieurement.";
                feedbackEl.className = "newsletter-feedback error";
            }
        });
    </script>
</body>

</html>

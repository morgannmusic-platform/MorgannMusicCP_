<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Morgann Music CP - Distribuez, Structurez, Élevez votre musique.">
    <meta name="theme-color" content="#d0a75a">
    <title>Morgann Music CP | Connexion</title>
    <link rel="stylesheet" href="/assets/css/login-signin.css">
    <link rel="stylesheet" href="assets/navbars/accueil/navbar-login.css">
    <script type="module" src="/assets/js/navbar.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="/assets/js/auth-ui.js" defer></script>
</head>

<body class="login-page">
    <div id="navbar"></div>
    <main class="auth-card">
        <div class="auth-split-container">
            <div class="auth-intro-side" style="margin-top: -110px; padding-top: 0;">
                <h2>Bon retour chez Morgann Music CP</h2>
                <p class="subtitle">Distribue, structure et élève ta musique au sommet.</p>
                <div class="auth-logo-showcase">
                    <img src="/assets/img/logo/logo-rose.svg" alt="Morgann Music CP Logo" class="large-brand-logo">
                </div>
            </div>

            <div class="auth-form-side">
                <h1>Connexion</h1>
                <p class="subtitle">Retrouve ton espace artiste.</p>

                <button type="button" id="google-login-btn" class="social-btn google-btn" style="margin-bottom: 20px;">
                    <svg width="18" height="18" viewBox="0 0 18 18">
                        <path fill="#4285F4"
                            d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z" />
                        <path fill="#34A853"
                            d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.41-1.57-5.13-3.72L.97 13.01C2.47 15.98 5.5 18 9 18z" />
                        <path fill="#FBBC05"
                            d="M3.87 10.8c-.2-.58-.31-1.2-.31-1.8s.11-1.22.31-1.8L.97 4.99C.35 6.22 0 7.58 0 9s.35 2.78.97 4.01l2.9-2.21z" />
                        <path fill="#EA4335"
                            d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.5 0 2.47 2.02.97 4.99l2.9 2.21C4.59 5.15 6.62 3.58 9 3.58z" />
                    </svg>
                    Continuer avec Google
                </button>

                <div class="divider">ou avec ton e-mail</div>

                <form id="login-form" novalidate>
                    <div id="credentials-group">
                        <div>
                            <label for="email">Email</label>
                            <input id="email" name="email" type="email" autocomplete="email" required>
                        </div>
                        <div>
                            <label for="password">Mot de passe</label>
                            <input id="password" name="password" type="password" autocomplete="current-password"
                                required>
                        </div>
                    </div>

                    <div id="totp-group" class="is-hidden">
                        <label for="totp-code">Code de l'application d'authentification</label>
                        <input id="totp-code" name="totp_code" type="text" inputmode="numeric" pattern="[0-9]{6}"
                            placeholder="123456" autocomplete="one-time-code">
                    </div>

                    <button type="submit" id="submit-btn">Se connecter</button>
                    <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
                </form>

                <p class="helper">Pas encore de compte ? <a href="/signin.html">Créer un compte</a></p>
            </div>
        </div>
    </main>

    <script type="module" src="/assets/js/login.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Page introuvable - Morgann Music CP">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#FC8FB0" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#52303c" media="(prefers-color-scheme: dark)">

    <link rel="icon" type="image/png" href="/assets/img/icons/sombre.png">
    <link rel="icon" type="image/png" href="/assets/img/icons/clair.png" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" href="/assets/img/icons/sombre.png" media="(prefers-color-scheme: dark)">
    <link rel="apple-touch-icon" href="/assets/img/icons/icon.png">

    <title>404 - Page Introuvable | Morgann Music CP</title>

    <!-- Inclusion de la police Poppins et des styles du site -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/styles-accueil.css">
    <link rel="stylesheet" href="/assets/footers/accueil/footer.css">

    <style>
        :root {
            --bg: #eaffc6;
            --rose: #FC8FB0;
            --text-secondary: #c76785;
            --container1: #f4fae1;
            --container2: #e2f2c3;
            --container3: #d7ebac;
            --border-subtle: rgba(252, 143, 176, 0.22);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #52303c;
                --rose: #FC8FB0;
                --text-secondary: #fbb4cb;
                --container1: #6a4c57;
                --container2: #4d5942;
                --container3: #3f4a34;
                --border-subtle: rgba(252, 143, 176, 0.25);
            }
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            font-family: 'Poppins', sans-serif;
            color: var(--rose);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .error-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 120px 1.5rem 4rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            text-align: center;
            position: relative;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 850px;
            height: clamp(220px, 40vw, 380px);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #particles-canvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: pointer;
        }

        .error-card {
            background: linear-gradient(145deg, var(--container1), var(--container3));
            border: 1px solid var(--border-subtle);
            border-radius: 36px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            margin-top: 1rem;
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.25rem;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .error-title {
            font-size: clamp(1.6rem, 4vw, 2.3rem);
            font-weight: 700;
            color: var(--rose);
            margin: 0;
            line-height: 1.2;
        }

        .error-subtitle {
            font-size: clamp(0.95rem, 2vw, 1.1rem);
            color: var(--text-secondary);
            margin: 0;
            line-height: 1.6;
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.95rem 2.2rem;
            background-color: var(--rose);
            color: var(--bg);
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 24px rgba(252, 143, 176, 0.25);
            margin-top: 0.5rem;
        }

        .cta-button:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 30px rgba(252, 143, 176, 0.4);
        }

        .cta-button svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            transition: transform 0.25s ease;
        }

        .cta-button:hover svg {
            transform: translateX(-4px);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .error-wrapper {
                padding-top: 100px;
            }

            .error-card {
                padding: 1.8rem 1.2rem;
                border-radius: 28px;
            }
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="/assets/js/background.js" defer></script>
    <script type="module" src="/assets/js/navbar.js" defer></script>
    <script src="/assets/footers/accueil/footer.js" defer></script>
</head>

<body>
    <div id="navbar"></div>

    <main class="error-wrapper">
        <!-- Canvas d'animation interactif pour le texte 404 en particules -->
        <div class="canvas-container">
            <canvas id="particles-canvas"></canvas>
        </div>

        <!-- Carte avec message d'erreur et bouton d'action -->
        <div class="error-card">
            <h1 class="error-title">Vous vous êtes perdus ?</h1>
            <p class="error-subtitle">
                La page ou la ressource que vous recherchez semble avoir été déplacée, supprimée ou n'a jamais existé.
            </p>
            <a href="/" class="cta-button">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
                </svg>
                Retourner à l'accueil
            </a>
        </div>
    </main>

    <div id="footer"></div>

    <!-- Script de l'effet de physique de particules interactif -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });

            let particles = [];
            let mouse = {
                x: null,
                y: null,
                radius: 90
            };

            let width = 0;
            let height = 0;

            // Classe représentant chaque point rose formant le chiffre 404
            class Particle {
                constructor(x, y) {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.baseX = x;
                    this.baseY = y;
                    this.size = Math.random() * 2.5 + 2.5;
                    this.density = (Math.random() * 25) + 12;
                    this.color = '#FC8FB0';
                    this.alpha = Math.random() * 0.4 + 0.6;
                }

                draw() {
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = this.alpha;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.closePath();
                    ctx.fill();
                }

                update() {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    let forceDirectionX = dx / distance;
                    let forceDirectionY = dy / distance;

                    let maxDistance = mouse.radius;
                    let force = (maxDistance - distance) / maxDistance;
                    let directionX = forceDirectionX * force * this.density;
                    let directionY = forceDirectionY * force * this.density;

                    if (distance < mouse.radius) {
                        this.x -= directionX;
                        this.y -= directionY;
                    } else {
                        if (this.x !== this.baseX) {
                            let dx = this.x - this.baseX;
                            this.x -= dx / 10;
                        }
                        if (this.y !== this.baseY) {
                            let dy = this.y - this.baseY;
                            this.y -= dy / 10;
                        }
                    }
                }
            }

            function initCanvasSize() {
                const rect = canvas.parentElement.getBoundingClientRect();
                width = rect.width;
                height = rect.height;
                canvas.width = width;
                canvas.height = height;
                mouse.radius = Math.min(width, height) * 0.3;
            }

            function createTextParticles() {
                particles = [];
                ctx.clearRect(0, 0, width, height);

                // Configuration du texte temporaire dans le canvas
                const fontSize = Math.min(width * 0.38, height * 0.85);
                ctx.fillStyle = '#FC8FB0';
                ctx.font = `800 ${fontSize}px 'Poppins', sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('404', width / 2, height / 2);

                // Extraction des pixels pour générer les positions des points
                const imageData = ctx.getImageData(0, 0, width, height);
                const data = imageData.data;

                // Espacement fixe pour garantir les performances et éviter les crashs
                const step = 9;

                for (let y = 0; y < height; y += step) {
                    for (let x = 0; x < width; x += step) {
                        const alphaIndex = (y * width + x) * 4 + 3;
                        if (data[alphaIndex] > 128) {
                            particles.push(new Particle(x, y));
                        }
                    }
                }
                ctx.clearRect(0, 0, width, height);
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                for (let i = 0; i < particles.length; i++) {
                    particles[i].draw();
                    particles[i].update();
                }
                requestAnimationFrame(animate);
            }

            // Événements de suivi de la souris et du tactile
            function updateMousePosition(clientX, clientY) {
                const rect = canvas.getBoundingClientRect();
                mouse.x = clientX - rect.left;
                mouse.y = clientY - rect.top;
            }

            window.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                if (
                    e.clientX >= rect.left &&
                    e.clientX <= rect.right &&
                    e.clientY >= rect.top &&
                    e.clientY <= rect.bottom
                ) {
                    updateMousePosition(e.clientX, e.clientY);
                } else {
                    mouse.x = null;
                    mouse.y = null;
                }
            });

            canvas.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    updateMousePosition(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            canvas.addEventListener('mouseleave', () => {
                mouse.x = null;
                mouse.y = null;
            });

            canvas.addEventListener('touchend', () => {
                mouse.x = null;
                mouse.y = null;
            });

            // Réinitialisation au redimensionnement
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    initCanvasSize();
                    createTextParticles();
                }, 150);
            });

            // Lancement du canvas et de l'animation après le chargement de la police (Crucial)
            document.fonts.ready.then(() => {
                initCanvasSize();
                createTextParticles();
                animate();
            });
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Créer une Nouvelle Sortie - MM-CP</title>
    <meta name="theme-color" content="#FC8FB0">
    <style>
        :root {
            --primary: #FC8FB0;
            --primary-hover: #f96490;
            --bg-color: #FC8FB0;
            --modal-bg: rgba(232, 232, 232, 0.349);
            --modal-border: rgba(189, 189, 189, 0.438);
            --text-main: #222;
            --text-label: #555;
            --card-bg: rgb(232, 232, 232);
            --card-hover-bg: #fff0f5;
            --input-bg: #ffffff;
            --input-border: #FC8FB0;
            --input-text: #222222;
            --btn-secondary-bg: #a1717f;
            --btn-secondary-hover: #aa5a68;
            --btn-disabled-bg: #b39da5;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #FC8FB0;
                --primary-hover: #ff7da4;
                --bg-color: #2c000d;
                --modal-bg: rgba(20, 0, 6, 0.75);
                --modal-border: rgba(252, 143, 176, 0.25);
                --text-main: #ffffff;
                --text-label: #ffccd9;
                --card-bg: rgba(0, 0, 0, 0.4);
                --card-hover-bg: rgba(252, 143, 176, 0.15);
                --input-bg: rgba(0, 0, 0, 0.4);
                --input-border: rgba(252, 143, 176, 0.3);
                --input-text: #ffffff;
                --btn-secondary-bg: #5c3541;
                --btn-secondary-hover: #734352;
                --btn-disabled-bg: #4a2833;
            }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            transition: background 0.3s ease;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--modal-bg);
            backdrop-filter: blur(62px);
            -webkit-backdrop-filter: blur(62px);
            border: 1px solid var(--modal-border);
            border-radius: 54px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.173);

            width: 100%;
            padding: 35px 55px;
            max-width: 500px;
            text-align: center;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            color: var(--text-main);
            font-size: 22px;
            margin-bottom: 20px;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .type-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .type-card {
            background-color: var(--card-bg);
            backdrop-filter: blur(62px);
            -webkit-backdrop-filter: blur(62px);
            border: 1px solid var(--modal-border);
            border-radius: 24px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.173);
            padding: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 16px;
            color: var(--text-main);
        }

        .type-card:hover {
            border-color: var(--primary);
            background: var(--card-hover-bg);
        }

        .type-card.selected {
            border-color: #ffffff;
            background: var(--primary);
            color: white;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--text-label);
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 50px;
            font-size: 16px;
            color: var(--input-text);
            box-sizing: border-box;
            outline: none;
        }

        .form-control option {
            background: var(--bg-color);
            color: var(--text-main);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            background: var(--primary);
            border: 1px solid #ffffff;
            color: white;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn:disabled {
            background: var(--btn-disabled-bg);
            border-color: transparent;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--btn-secondary-bg);
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: var(--btn-secondary-hover);
        }
    </style>
</head>

<body>

    <div class="modal-overlay">
        <div class="modal-content">

            <div id="step-1" class="step active">
                <h2>Quel est le format de cette sortie ?</h2>
                <div class="type-grid">
                    <div class="type-card" onclick="selectionnerType('Album', this)">
                        <div data-v-2b873b6e="" class="ir__type-icon"><svg width="22" height="22" viewBox="0 0 24 24"
                                fill="none">
                                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"></circle>
                                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"></circle>
                                <path d="M12 2a10 10 0 0 1 7.07 2.93" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" opacity=".4"></path>
                            </svg></div>Album
                    </div>
                    <div class="type-card" onclick="selectionnerType('EP', this)">
                        <div data-v-2b873b6e="" class="ir__type-icon"><svg width="22" height="22" viewBox="0 0 24 24"
                                fill="none">
                                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"></circle>
                                <circle cx="12" cy="12" r="4" fill="currentColor" opacity=".25"></circle>
                                <circle cx="12" cy="12" r="1.5" fill="currentColor"></circle>
                            </svg></div>EP
                    </div>
                    <div class="type-card" onclick="selectionnerType('Single', this)">
                        <div data-v-2b873b6e="" class="ir__type-icon"><svg width="22" height="22" viewBox="0 0 24 24"
                                fill="none">
                                <path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round"></path>
                                <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="2"></circle>
                            </svg></div>Single
                    </div>
                    <div class="type-card" onclick="selectionnerType('Compilation', this)">
                        <div data-v-2b873b6e="" class="ir__type-icon"><svg width="22" height="22" viewBox="0 0 24 24"
                                fill="none">
                                <rect x="3" y="7" width="14" height="14" rx="2" stroke="currentColor" stroke-width="2">
                                </rect>
                                <path d="M7 7V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2" stroke="currentColor"
                                    stroke-width="2"></path>
                            </svg></div>Compilation
                    </div>
                </div>
                <button id="btn-next-1" class="btn" onclick="passerEtape(2)" disabled>Suivant</button>
            </div>

            <div id="step-2" class="step">
                <h2>Quel est le titre de la sortie ?</h2>
                <div class="form-group">
                    <label for="release-title">Titre du projet</label>
                    <input type="text" id="release-title" class="form-control" placeholder="Ex: My Beautiful World"
                        oninput="validerEtape2()">
                </div>
                <button id="btn-next-2" class="btn" onclick="passerEtape(3)" disabled>Suivant</button>
                <button class="btn btn-secondary" onclick="passerEtape(1)">Retour</button>
            </div>

            <div id="step-3" class="step">
                <h2>Qui est l'artiste principal ?</h2>
                <div class="form-group">
                    <label for="release-artist">Sélectionner un artiste</label>
                    <select id="release-artist" class="form-control" onchange="validerEtape3()">
                        <option value="">-- Charger les artistes... --</option>
                    </select>
                </div>
                <button id="btn-submit" class="btn" onclick="creerNouvelleSortie()" disabled>Créer la sortie</button>
                <button class="btn btn-secondary" onclick="passerEtape(2)">Retour</button>
            </div>

        </div>
    </div>

    <script type="module">
        import { auth } from "/assets/js/firebase.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { api } from "/assets/js/api.js";

        let uidConnecte = null;
        let artistesDataMap = {};
        let donneesSortie = {
            type: "",
            title: "",
            artistName: "",
            status: "brouillon"
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                uidConnecte = user.uid;
                chargerListeArtistes();
            } else {
                window.location.href = "login.html";
            }
        });

        window.selectionnerType = function (type, element) {
            document.querySelectorAll('.type-card').forEach(card => card.classList.remove('selected'));
            element.classList.add('selected');
            donneesSortie.type = type;
            document.getElementById('btn-next-1').disabled = false;
        };

        window.passerEtape = function (numEtape) {
            document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
            document.getElementById(`step-${numEtape}`).classList.add('active');
        };

        window.validerEtape2 = function () {
            const titreInput = document.getElementById('release-title').value.trim();
            donneesSortie.title = titreInput;
            document.getElementById('btn-next-2').disabled = (titreInput.length === 0);
        };

        async function chargerListeArtistes() {
            try {
                const selectArtist = document.getElementById("release-artist");
                const artistes = await api.get(`/api/users/${uidConnecte}/artists`);

                selectArtist.innerHTML = '<option value="">-- Choisir un artiste --</option>';
                artistesDataMap = {};

                if (artistes && artistes.length > 0) {
                    artistes.forEach((artist) => {
                        artistesDataMap[artist.name] = artist;
                        selectArtist.innerHTML += `<option value="${artist.name}">${artist.name}</option>`;
                    });
                } else {
                    selectArtist.innerHTML = '<option value="">Aucun artiste trouvé.</option>';
                }
            } catch (error) {
                console.error("Erreur API artistes :", error);
            }
        }
        window.chargerListeArtistes = chargerListeArtistes;

        window.validerEtape3 = async function () {
            const artisteSelectionne = document.getElementById('release-artist').value;
            donneesSortie.artistName = artisteSelectionne;
            document.getElementById('btn-submit').disabled = (artisteSelectionne === "");

            if (artisteSelectionne && artistesDataMap[artisteSelectionne]) {
                const artistObj = artistesDataMap[artisteSelectionne];

                try {
                    const response = await api.get(`/api/users/${uidConnecte}/artists/${artistObj.id}`);
                    const fullData = response.artist || response;
                    const editorData = response.editor || {};

                    donneesSortie.primaryGenre = editorData.primaryGenre || fullData.primaryGenre || "";
                    donneesSortie.secondaryGenre = editorData.secondaryGenre || fullData.secondaryGenre || "";
                    donneesSortie.language = editorData.defaultLanguage || fullData.defaultLanguage || "";
                    donneesSortie.timezone = editorData.timezone || fullData.timezone || "";
                    donneesSortie.exactTime = editorData.releaseTime || fullData.releaseTime || "";
                    donneesSortie.labelName = editorData.labelName || fullData.labelName || "Morgann Music CP";
                    donneesSortie.copyrightLineC = editorData.lineCopyright || fullData.lineCopyright || artisteSelectionne;
                    donneesSortie.copyrightLineP = editorData.linePhonogram || fullData.linePhonogram || "Morgann Music CP";

                    donneesSortie.writers = editorData.writers || fullData.writers || [];
                    donneesSortie.credits = editorData.credits || fullData.credits || [];
                    donneesSortie.additionalDeliveries = editorData.deliveries || fullData.deliveries || [];
                } catch (e) {
                    console.error("Erreur lors du chargement des options de l'éditeur pour l'artiste :", e);
                }
            }
        };

        window.creerNouvelleSortie = async function () {
            if (!uidConnecte) {
                alert("Erreur: Utilisateur non identifié. Recharge la page.");
                return;
            }

            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Création en cours...";

            donneesSortie.createdAt = new Date().toISOString();
            donneesSortie.coverUrl = "";

            try {
                const result = await api.post(`/api/users/${uidConnecte}/releases`, donneesSortie);

                if (result && result.id) {
                    window.location.href = `edition.html?sortie=${result.id}`;
                } else {
                    throw new Error("ID de sortie non reçu par le serveur");
                }
            } catch (error) {
                console.error(error);
                alert("Erreur lors de la création : " + error.message);
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Créer la sortie";
            }
        };
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Admin - Édition Totale Sortie | MMCP Admin</title>
    <link rel="stylesheet" href="admin.css">
    <style>
        .details-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .card {
            background-color: rgba(232, 232, 232, 0.349);
            backdrop-filter: blur(62px);
            -webkit-backdrop-filter: blur(62px);
            border: 1px solid rgba(189, 189, 189, 0.438);
            border-radius: 34px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.268);
            padding: 24px;
            margin-top: 50px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 12px;
            text-transform: uppercase;
            color: #3e3e3e;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .form-control {
            background-color: rgba(232, 232, 232, 0.133);
            backdrop-filter: blur(62px);
            -webkit-backdrop-filter: blur(62px);
            border: 1px solid rgba(189, 189, 189, 0.438);
            border-radius: 34px;
            box-shadow: 0 0 9px rgba(0, 0, 0, 0.174);
            padding: 10px 12px;
            color: #000000;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #FC8FB0;
        }

        .track-box {
            background-color: rgba(232, 232, 232, 0.164);
            backdrop-filter: blur(62px);
            -webkit-backdrop-filter: blur(62px);
            border: 1px solid rgba(189, 189, 189, 0.438);
            border-radius: 34px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.268);
            padding: 20px;
            margin-bottom: 16px;
        }

        .track-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .btn-delete-track {
            background: #ef4444;
            color: rgb(0, 0, 0);
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-delete-track:hover {
            background: #dc2626;
        }

        .btn-add-track {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 20px;
            transition: background 0.2s;
        }

        .btn-add-track:hover {
            background: #059669;
        }

        .btn-save {
            background: #FC8FB0;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 25px;
            font-size: 16px;
            transition: background 0.2s;
        }

        .btn-save:hover {
            background: #b04968;
        }

        .audio-preview {
            margin-top: 6px;
            font-size: 12px;
            color: #000000;
        }

        #loading-message {
            font-size: 16px;
            color: #373737;
            text-align: center;
            padding: 40px;
        }
    </style>
</head>

<body>

    <div class="admin-wrapper">
        <aside id="sidebar-injector" class="sidebar-container"></aside>

        <main class="main-container">
            <header id="navbar-injector" class="navbar-container"></header>

            <div class="details-container">
                <div id="loading-message" class="card">Chargement de la sortie en cours...</div>

                <div class="card" id="admin-panel" style="display:none;">
                    <h2 style="margin:0; color:#000000;">Édition Complète (Mode Admin D1)</h2>
                    <p style="color: #363636; font-size: 14px; margin-top: 4px; margin-bottom: 24px;">Métadonnées et
                        pistes associées.</p>

                    <h3 style="color:#000000; margin-bottom: 0;">Métadonnées de la Release</h3>
                    <div class="form-grid">
                        <div class="form-group"><label>Titre</label><input type="text" id="edit-title"
                                class="form-control"></div>
                        <div class="form-group"><label>Version (Version Line)</label><input type="text"
                                id="edit-versionLine" class="form-control"></div>
                        <div class="form-group"><label>Artiste Principal</label><input type="text" id="edit-artistName"
                                class="form-control"></div>
                        <div class="form-group"><label>Type (Single/Album...)</label><input type="text" id="edit-type"
                                class="form-control"></div>
                        <div class="form-group"><label>Format</label><input type="text" id="edit-format"
                                class="form-control"></div>
                        <div class="form-group"><label>Statut</label>
                            <select id="edit-status" class="form-control">
                                <option value="verification mmcp">Vérification MMCP</option>
                                <option value="verification plate-formes">Vérification Plate-formes</option>
                                <option value="livrée">Livrée</option>
                                <option value="direct">Direct</option>
                                <option value="licence">Licence</option>
                                <option value="retrait">Retrait</option>
                                <option value="retiré">Retiré</option>
                            </select>
                        </div>
                        <div class="form-group"><label>Code UPC</label><input type="text" id="edit-upc"
                                class="form-control" oninput="verifierEtGenererCatalog()"></div>
                        <div class="form-group"><label>Code Catalogue MMCP</label><input type="text"
                                id="edit-catalogNumber" class="form-control" readonly
                                style="background:#0f172a; font-weight:bold; color:#d01159;"></div>
                        <div class="form-group"><label>Label</label><input type="text" id="edit-label"
                                class="form-control"></div>
                        <div class="form-group"><label>Nom du Label (LabelName)</label><input type="text"
                                id="edit-labelName" class="form-control"></div>
                        <div class="form-group"><label>Genre Principal</label><input type="text" id="edit-primaryGenre"
                                class="form-control"></div>
                        <div class="form-group"><label>Genre Secondaire</label><input type="text"
                                id="edit-secondaryGenre" class="form-control"></div>
                        <div class="form-group"><label>Langue</label><input type="text" id="edit-language"
                                class="form-control"></div>
                        <div class="form-group"><label>Type de Licence</label><input type="text" id="edit-licenceType"
                                class="form-control"></div>
                        <div class="form-group"><label>Copyright Standard</label><input type="text"
                                id="edit-stdCopyright" class="form-control"></div>
                        <div class="form-group"><label>Ligne de Copyright C</label><input type="text"
                                id="edit-copyrightLineC" class="form-control"></div>
                        <div class="form-group"><label>Ligne de Copyright P</label><input type="text"
                                id="edit-copyrightLineP" class="form-control"></div>
                        <div class="form-group"><label>Date de Sortie</label><input type="date" id="edit-releaseDate"
                                class="form-control"></div>
                        <div class="form-group"><label>Date de Sortie Originale</label><input type="text"
                                id="edit-originalReleaseDate" class="form-control"></div>
                        <div class="form-group"><label>Date de Pré-commande</label><input type="text"
                                id="edit-preorderDate" class="form-control"></div>
                        <div class="form-group"><label>Heure exacte</label><input type="text" id="edit-exactTime"
                                class="form-control"></div>
                        <div class="form-group"><label>Fuseau Horaire</label><input type="text" id="edit-timezone"
                                class="form-control"></div>

                        <div class="form-group full-width"><label style="color:#10b981;">Lien de la sortie (Smartlink /
                                URL globale)</label><input type="text" id="edit-releaseUrl" class="form-control"
                                placeholder="https://..." style="border-color:#10b981;"></div>

                        <div class="form-group full-width"
                            style="background: rgba(208, 17, 89, 0.05); padding: 16px; border-radius: 20px; border: 1px dashed #d01159;">
                            <label style="color:#d01159; font-weight: bold; font-size: 13px;">Pochette Animée (Carré,
                                format MP4)</label>
                            <p style="font-size: 12px; color: #555; margin: 4px 0 10px 0;">Importe directement le
                                fichier vidéo MP4 carré (pas de lien externe).</p>
                            <input type="file" id="edit-animatedCoverFile" class="form-control" accept="video/mp4"
                                style="background: white; border-radius: 12px;">
                            <input type="hidden" id="edit-animatedCoverUrl">
                            <div id="animated-cover-preview" style="margin-top: 12px;"></div>
                        </div>

                        <div class="form-group"><label>Spotify URL</label><input type="text" id="edit-spotifyUrl"
                                class="form-control"></div>
                        <div class="form-group"><label>Apple Music URL</label><input type="text" id="edit-appleUrl"
                                class="form-control"></div>
                        <div class="form-group"><label>Territoires</label><input type="text" id="edit-territories"
                                class="form-control"></div>

                        <div class="form-group"><label>Afficher sur le catalogue MMCP</label>
                            <select id="edit-showOnMmcpCatalog" class="form-control">
                                <option value="true">Oui (Activé par défaut)</option>
                                <option value="false">Non (Masqué)</option>
                            </select>
                        </div>

                        <div class="form-group"><label>Plateformes manuelles</label>
                            <select id="edit-manualPlatforms" class="form-control">
                                <option value="true">Oui</option>
                                <option value="false">Non</option>
                            </select>
                        </div>
                        <div class="form-group full-width"><label>Plateformes Sélectionnées (séparées par des
                                virgules)</label><input type="text" id="edit-selectedPlatforms" class="form-control">
                        </div>
                        <div class="form-group full-width"><label>Livraisons Additionnelles (séparées par des
                                virgules)</label><input type="text" id="edit-additionalDeliveries" class="form-control">
                        </div>
                    </div>

                    <h3 style="color:#000000; margin-top: 32px; margin-bottom: 12px;">Édition Complète des Pistes</h3>
                    <div id="admin-tracks-list"></div>

                    <button type="button" class="btn-add-track" onclick="ajouterPiste()">+ Ajouter une piste</button>

                    <button class="btn-save" onclick="sauvegarderSortieAdmin()">Enregistrer et synchroniser sur la base
                        D1</button>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { auth } from "/assets/js/firebase.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
        import { api } from "/assets/js/api.js";
        import { initSidebar } from "./sidebar.js";
        import { chargerProfilNavbar } from "./navbar.js";

        const WORKER_URL = "https://api.worker.mm-cp.uk";

        const urlParams = new URLSearchParams(window.location.search);
        const releaseId = urlParams.get('id');
        let detectUserId = null;
        let pistesActuelles = [];
        let ancienStatut = "";

        // Fonction utilitaire pour s'assurer que les URL relatives pointent vers le bon Worker
        function corrigerUrlFichier(url) {
            if (!url) return "";
            if (url.startsWith("http://") || url.startsWith("https://") || url.startsWith("data:")) {
                return url;
            }
            const cleanPath = url.startsWith('/') ? url : '/' + url;
            return `${WORKER_URL}${cleanPath}`;
        }

        async function injecterComposants() {
            try {
                const resSidebar = await fetch('sidebar.html');
                if (resSidebar.ok) {
                    document.getElementById('sidebar-injector').innerHTML = await resSidebar.text();
                    initSidebar(auth);
                }

                const resNavbar = await fetch('navbar.html');
                if (resNavbar.ok) {
                    document.getElementById('navbar-injector').innerHTML = await resNavbar.text();
                    if (auth.currentUser) chargerProfilNavbar(null, auth.currentUser);
                }
            } catch (e) {
                console.error("Erreur injection composants : ", e);
            }
        }

        injecterComposants();

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "/login.html"; return; }

            chargerProfilNavbar(null, user);

            try {
                if (releaseId) { await chercherEtChargerSortie(); }
            } catch (err) { console.error(err); }
        });

        window.verifierEtGenererCatalog = function () {
            const upcVal = document.getElementById("edit-upc").value.trim();
            const catEl = document.getElementById("edit-catalogNumber");
            if (upcVal.length > 0 && (!catEl.value || catEl.value === "-")) {
                let rands = "";
                for (let i = 0; i < 10; i++) rands += Math.floor(Math.random() * 10);
                catEl.value = "MMCP" + rands;
            }
        };

        function capturerSaisiesPistes() {
            pistesActuelles.forEach((t, i) => {
                const elTitle = document.getElementById(`t-title-${i}`);
                if (!elTitle) return;

                pistesActuelles[i].title = elTitle.value;
                pistesActuelles[i].version = document.getElementById(`t-version-${i}`).value;
                pistesActuelles[i].isrc = document.getElementById(`t-isrc-${i}`).value.trim();
                pistesActuelles[i].iswc = document.getElementById(`t-iswc-${i}`).value.trim();
                pistesActuelles[i].writers = document.getElementById(`t-writers-${i}`).value;
                pistesActuelles[i].appleCredits = document.getElementById(`t-appleCredits-${i}`).value;
                pistesActuelles[i].language = document.getElementById(`t-language-${i}`).value;
                pistesActuelles[i].lyricType = document.getElementById(`t-lyricType-${i}`).value;
                pistesActuelles[i].isAiGenerated = document.getElementById(`t-ai-${i}`).value === "true";
                pistesActuelles[i].audioUrl = document.getElementById(`t-audio-${i}`).value;
                pistesActuelles[i].instrumentalAudioUrl = document.getElementById(`t-inst-${i}`).value;
                pistesActuelles[i].atmosAudioUrl = document.getElementById(`t-atmos-${i}`).value.trim();
                pistesActuelles[i].atmosInstrumentalAudioUrl = document.getElementById(`t-atmos-inst-${i}`).value.trim();
                pistesActuelles[i].lyricsText = document.getElementById(`t-lyrics-${i}`).value;

                pistesActuelles[i].tiktokStart = {
                    minute: parseInt(document.getElementById(`t-tk-m-${i}`).value) || 0,
                    second: parseInt(document.getElementById(`t-tk-s-${i}`).value) || 0
                };
                try { pistesActuelles[i].artists = JSON.parse(document.getElementById(`t-artists-${i}`).value); } catch (e) { }
            });
        }

        function afficherPistesHTML() {
            const container = document.getElementById("admin-tracks-list");
            container.innerHTML = "";

            pistesActuelles.forEach((t, i) => {
                const audioSrc = corrigerUrlFichier(t.audioUrl);
                const instSrc = corrigerUrlFichier(t.instrumentalAudioUrl);

                const box = document.createElement("div");
                box.className = "track-box";
                box.innerHTML = `
                    <div class="track-header">
                        <div style="font-weight:bold; color:#d01159;">Piste ${i + 1} : ${t.title || 'Sans titre'}</div>
                        <button type="button" class="btn-delete-track" onclick="supprimerPiste(${i})">Supprimer cette piste</button>
                    </div>
                    <div class="form-grid">
                        <div class="form-group"><label>Titre Piste</label><input type="text" id="t-title-${i}" class="form-control" value="${t.title || ''}"></div>
                        <div class="form-group"><label>Version</label><input type="text" id="t-version-${i}" class="form-control" value="${t.version || ''}"></div>
                        <div class="form-group"><label>Code ISRC</label><input type="text" id="t-isrc-${i}" class="form-control" value="${t.isrc || ''}" style="font-weight:bold; color:#d01159;"></div>
                        <div class="form-group"><label>Code ISWC</label><input type="text" id="t-iswc-${i}" class="form-control" value="${t.iswc || ''}"></div>
                        <div class="form-group"><label>Artistes principaux & rôles (JSON stringified)</label><input type="text" id="t-artists-${i}" class="form-control" value='${JSON.stringify(t.artists || [])}'></div>
                        <div class="form-group"><label>Writers (Crédits)</label><input type="text" id="t-writers-${i}" class="form-control" value="${t.writers || ''}"></div>
                        <div class="form-group"><label>Apple Credits</label><input type="text" id="t-appleCredits-${i}" class="form-control" value="${t.appleCredits || ''}"></div>
                        <div class="form-group"><label>Langue</label><input type="text" id="t-language-${i}" class="form-control" value="${t.language || ''}"></div>
                        <div class="form-group"><label>Type de paroles (Clean/Explicit...)</label><input type="text" id="t-lyricType-${i}" class="form-control" value="${t.lyricType || ''}"></div>
                        <div class="form-group"><label>IA Générée</label><select id="t-ai-${i}" class="form-control"><option value="true" ${t.isAiGenerated ? 'selected' : ''}>Oui</option><option value="false" ${!t.isAiGenerated ? 'selected' : ''}>Non</option></select></div>
                        <div class="form-group"><label>TikTok Start (Min)</label><input type="number" id="t-tk-m-${i}" class="form-control" value="${t.tiktokStart?.minute || 0}"></div>
                        <div class="form-group"><label>TikTok Start (Sec)</label><input type="number" id="t-tk-s-${i}" class="form-control" value="${t.tiktokStart?.second || 0}"></div>
                        <div class="form-group full-width"><label>Texte des Paroles</label><textarea id="t-lyrics-${i}" class="form-control" rows="2">${t.lyricsText || ''}</textarea></div>
                        
                        <div class="form-group full-width"><label>Audio URL (Stéréo Principal)</label><input type="text" id="t-audio-${i}" class="form-control" value="${t.audioUrl || ''}"><div class="audio-preview">${audioSrc ? `<audio controls src="${audioSrc}"></audio>` : 'Aucun'}</div></div>
                        <div class="form-group full-width"><label>Instrumental Audio URL (Stéréo)</label><input type="text" id="t-inst-${i}" class="form-control" value="${t.instrumentalAudioUrl || ''}"><div class="audio-preview">${instSrc ? `<audio controls src="${instSrc}"></audio>` : 'Aucun'}</div></div>
                        
                        <div class="form-group full-width"><label style="color:#60a5fa;">Dolby Atmos Audio URL (Principal)</label><input type="text" id="t-atmos-${i}" class="form-control" value="${t.atmosAudioUrl || ''}" placeholder="Lien vers le fichier .wav / .caf ou dossier Atmos master"><div class="audio-preview">${t.atmosAudioUrl ? `<span style="color:#34d399; font-weight:bold;">✓ Master Atmos configuré</span>` : 'Aucun'}</div></div>
                        <div class="form-group full-width"><label style="color:#60a5fa;">Dolby Atmos Instrumental Audio URL</label><input type="text" id="t-atmos-inst-${i}" class="form-control" value="${t.atmosInstrumentalAudioUrl || ''}" placeholder="Lien vers le fichier instrumental Atmos master"><div class="audio-preview">${t.atmosInstrumentalAudioUrl ? `<span style="color:#34d399; font-weight:bold;">✓ Master Atmos Instrumental configuré</span>` : 'Aucun'}</div></div>
                    </div>
                `;
                container.appendChild(box);
            });
        }

        window.supprimerPiste = function (index) {
            if (confirm(`Veux-tu vraiment supprimer la piste ${index + 1} ?`)) {
                capturerSaisiesPistes();
                pistesActuelles.splice(index, 1);
                afficherPistesHTML();
            }
        };

        window.ajouterPiste = function () {
            capturerSaisiesPistes();
            pistesActuelles.push({
                title: "", version: "", isrc: "", iswc: "", artists: [], writers: "", appleCredits: "", language: "", lyricType: "", isAiGenerated: false, tiktokStart: { minute: 0, second: 0 }, lyricsText: "", audioUrl: "", instrumentalAudioUrl: "", atmosAudioUrl: "", atmosInstrumentalAudioUrl: ""
            });
            afficherPistesHTML();
        };

        async function chercherEtChargerSortie() {
            try {
                const res = await api.get(`/api/releases/${releaseId}`);
                const data = res.release || res;

                if (!data) {
                    alert("Sortie introuvable.");
                    return;
                }

                detectUserId = data.userId || data.user_id;
                ancienStatut = data.status || "";

                const simples = ["title", "versionLine", "artistName", "type", "format", "upc", "catalogNumber", "label", "labelName", "primaryGenre", "secondaryGenre", "language", "licenceType", "stdCopyright", "copyrightLineC", "copyrightLineP", "releaseDate", "originalReleaseDate", "preorderDate", "exactTime", "timezone", "releaseUrl", "spotifyUrl", "appleUrl", "territories", "status"];
                simples.forEach(f => {
                    const el = document.getElementById(`edit-${f}`);
                    if (el) el.value = data[f] || "";
                });

                document.getElementById("edit-showOnMmcpCatalog").value = data.showOnMmcpCatalog !== undefined ? String(data.showOnMmcpCatalog) : "true";
                document.getElementById("edit-manualPlatforms").value = data.manualPlatforms !== undefined ? String(data.manualPlatforms) : "false";
                document.getElementById("edit-selectedPlatforms").value = Array.isArray(data.selectedPlatforms) ? data.selectedPlatforms.join(", ") : "";
                document.getElementById("edit-additionalDeliveries").value = Array.isArray(data.additionalDeliveries) ? data.additionalDeliveries.join(", ") : "";

                const animUrl = data.animatedCoverUrl || "";
                document.getElementById("edit-animatedCoverUrl").value = animUrl;
                const animPreview = document.getElementById("animated-cover-preview");
                if (animUrl) {
                    const fullAnimUrl = corrigerUrlFichier(animUrl);
                    animPreview.innerHTML = `<div style="display:flex; align-items:center; gap:12px;"><video autoplay loop muted playsinline src="${fullAnimUrl}" style="width:120px; height:120px; object-fit:cover; border-radius:16px; border:1px solid #ccc;"></video><span style="font-size:12px; color:#10b981; font-weight:bold;">✓ Pochette animée active</span></div>`;
                } else {
                    animPreview.innerHTML = `<span style="font-size:12px; color:#666;">Aucune pochette animée importée</span>`;
                }

                pistesActuelles = typeof data.tracks === 'string' ? JSON.parse(data.tracks) : (data.tracks || []);
                afficherPistesHTML();

                document.getElementById("loading-message").style.display = "none";
                document.getElementById("admin-panel").style.display = "block";
            } catch (err) {
                console.error("Erreur de chargement de la sortie :", err);
                document.getElementById("loading-message").textContent = "Erreur lors du chargement de la sortie.";
            }
        }

        async function envoyerNotificationStatut(userId, titleRelease, nouveauStatut) {
            if (!userId) return;
            let message = `Le statut de votre sortie "${titleRelease}" a été mis à jour vers "${nouveauStatut}".`;

            try {
                await api.post(`/api/users/${userId}/notifications`, {
                    titre: "Mise à jour de votre sortie",
                    notif: message
                });
            } catch (err) {
                console.error("Erreur d'envoi de la notification :", err);
            }
        }

        window.sauvegarderSortieAdmin = async function () {
            capturerSaisiesPistes();

            const selPlat = document.getElementById("edit-selectedPlatforms").value;
            const addDel = document.getElementById("edit-additionalDeliveries").value;
            let nouveauStatut = document.getElementById("edit-status").value;
            const releaseTitle = document.getElementById("edit-title").value || "Sans titre";
            const releaseDateVal = document.getElementById("edit-releaseDate").value;

            if (releaseDateVal) {
                const today = new Date().toISOString().split('T')[0];
                if (today >= releaseDateVal && nouveauStatut !== "retrait" && nouveauStatut !== "retiré") {
                    nouveauStatut = "direct";
                    document.getElementById("edit-status").value = "direct";
                }
            }

            let animatedCoverUrl = document.getElementById("edit-animatedCoverUrl").value;
            const fileInput = document.getElementById("edit-animatedCoverFile");
            if (fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                if (file.type !== "video/mp4") {
                    alert("Le fichier de la pochette animée doit être au format MP4.");
                    return;
                }
                try {
                    const formData = new FormData();
                    formData.append("file", file);
                    alert("Importation de la pochette animée en cours...");
                    const res = await api.upload("/api/upload/cover", formData);
                    animatedCoverUrl = res.url || `/api/files/${res.key}`;
                    document.getElementById("edit-animatedCoverUrl").value = animatedCoverUrl;
                } catch (e) {
                    alert("Erreur lors de l'upload de la pochette animée : " + e.message);
                    return;
                }
            }

            const updateData = {
                showOnMmcpCatalog: document.getElementById("edit-showOnMmcpCatalog").value === "true",
                manualPlatforms: document.getElementById("edit-manualPlatforms").value === "true",
                selectedPlatforms: selPlat ? selPlat.split(",").map(s => s.trim()) : [],
                additionalDeliveries: addDel ? addDel.split(",").map(s => s.trim()) : [],
                animatedCoverUrl: animatedCoverUrl,
                tracks: pistesActuelles
            };

            ["title", "versionLine", "artistName", "type", "format", "upc", "catalogNumber", "label", "labelName", "primaryGenre", "secondaryGenre", "language", "licenceType", "stdCopyright", "copyrightLineC", "copyrightLineP", "releaseDate", "originalReleaseDate", "preorderDate", "exactTime", "timezone", "releaseUrl", "spotifyUrl", "appleUrl", "territories"].forEach(f => {
                updateData[f] = document.getElementById("edit-" + f).value;
            });

            updateData["status"] = nouveauStatut;

            try {
                await api.patch(`/api/releases/${releaseId}`, updateData);

                if (nouveauStatut !== ancienStatut) {
                    await envoyerNotificationStatut(detectUserId, releaseTitle, nouveauStatut);
                    ancienStatut = nouveauStatut;
                }

                alert("Base de données D1 synchronisée intégralement avec succès !");
            } catch (err) {
                alert("Erreur lors de la sauvegarde : " + err.message);
            }
        }
    </script>
</body>

</html>

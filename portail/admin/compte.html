<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails du Compte | MMCP Admin</title>
    <link rel="stylesheet" href="admin.css">
    <style>
        .account-container {
            margin-top: 50px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .card {
            background-color: rgba(232, 232, 232, 0.349);
            backdrop-filter: blur(62px);
            -webkit-backdrop-filter: blur(62px);
            border: 1px solid rgba(189, 189, 189, 0.438);
            border-radius: 34px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.268);
            color: black;
            padding: 24px;
        }

        .profile-header-card {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .profile-avatar-lg {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: #000000;
            overflow: hidden;
            border: 2px solid #FC8FB0;
            flex-shrink: 0;
        }

        .profile-avatar-lg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 12px;
            text-transform: uppercase;
            color: #525252;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .form-control {
            background-color: rgba(232, 232, 232, 0.349);
            backdrop-filter: blur(62px);
            -webkit-backdrop-filter: blur(62px);
            border: 1px solid rgba(189, 189, 189, 0.438);
            border-radius: 34px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.268);
            padding: 10px 12px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #FC8FB0;
        }

        .btn-save {
            background: #FC8FB0;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }

        .btn-save:hover {
            background: #ae6178;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .item-card {
            background-color: rgba(232, 232, 232, 0.115);
            backdrop-filter: blur(62px);
            -webkit-backdrop-filter: blur(62px);
            border: 1px solid rgba(189, 189, 189, 0.438);
            border-radius: 24px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.268);
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .item-card:hover {
            transform: translateY(-3px);
            border-color: #FC8FB0;
        }

        .item-cover {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 8px;
            object-fit: cover;
            background: #e2e8f0;
            margin-bottom: 8px;
        }

        .item-title {
            font-size: 13px;
            font-weight: 600;
            color: #000000;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-sub {
            font-size: 11px;
            color: #64748b;
        }

        .alert-status {
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="admin-wrapper">
        <aside id="sidebar-injector" class="sidebar-container"></aside>

        <main class="main-container">
            <header id="navbar-injector" class="navbar-container"></header>

            <div class="account-container">

                <!-- EN-TÊTE PROFIL -->
                <div class="card profile-header-card">
                    <div class="profile-avatar-lg" id="avatar-container">
                        <span id="avatar-initials">?</span>
                    </div>
                    <div>
                        <h2 style="margin: 0; color: #000000;" id="header-user-name">Chargement...</h2>
                        <p style="margin: 4px 0 0 0; color: #3a3a3a; font-size: 14px;" id="header-user-email">—</p>
                    </div>
                </div>

                <!-- FORMULAIRE DES INFORMATIONS COMPTE -->
                <div class="card">
                    <h3 style="margin: 0; color: #000000;">Informations du compte</h3>

                    <form id="user-form">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Prénom (firstName)</label>
                                <input type="text" id="firstName" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Nom (lastName)</label>
                                <input type="text" id="lastName" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Nom complet (fullName)</label>
                                <input type="text" id="fullName" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Nom d'artiste (artistName)</label>
                                <input type="text" id="artistName" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Email (email)</label>
                                <input type="email" id="email" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>URL Photo de profil (photoURL)</label>
                                <input type="text" id="photoURL" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Rôle (role)</label>
                                <input type="text" id="role" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Plan (planName)</label>
                                <input type="text" id="planName" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Statut abonnement (subscriptionStatus)</label>
                                <input type="text" id="subscriptionStatus" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Adresse (address)</label>
                                <input type="text" id="address" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Ville (city)</label>
                                <input type="text" id="city" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Code Postal (postalCode)</label>
                                <input type="text" id="postalCode" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>IBAN (iban)</label>
                                <input type="text" id="iban" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Thème (theme)</label>
                                <input type="text" id="theme" class="form-control">
                            </div>
                        </div>

                        <button type="submit" class="btn-save">Enregistrer les modifications</button>
                        <div id="save-status" class="alert-status"></div>
                    </form>
                </div>

                <!-- SECTION DES SORTIES / RELEASES -->
                <div class="card">
                    <h3 style="margin: 0; color: #000000;">Sorties / Musiques</h3>
                    <div id="releases-grid" class="items-grid">
                        <p style="color: #64748b; font-size: 14px;">Chargement des sorties...</p>
                    </div>
                </div>

                <!-- SECTION DES ARTISTES -->
                <div class="card">
                    <h3 style="margin: 0; color: #000000;">Artistes associés</h3>
                    <div id="artists-grid" class="items-grid">
                        <p style="color: #64748b; font-size: 14px;">Chargement des artistes...</p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script type="module">
        import { auth } from "/assets/js/firebase.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
        import { api } from "/assets/js/api.js";
        import { initSidebar } from "./sidebar.js";
        import { chargerProfilNavbar } from "./navbar.js";

        // Récupérer l'ID de l'URL (?id=...)
        const urlParams = new URLSearchParams(window.location.search);
        const targetUserId = urlParams.get('id');

        const DEFAULT_COVER = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300"><rect width="100%" height="100%" fill="%23e2e8f0"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="16" fill="%2364748b">Pas d'image</text></svg>`;

        const fields = [
            'firstName', 'lastName', 'fullName', 'artistName',
            'email', 'photoURL', 'role', 'planName',
            'subscriptionStatus', 'address', 'city', 'postalCode',
            'iban', 'theme'
        ];

        function formerUrlComplet(rawUrl) {
            if (!rawUrl) return null;
            if (rawUrl.startsWith('http://') || rawUrl.startsWith('https://') || rawUrl.startsWith('data:')) {
                return rawUrl;
            }
            if (typeof api.fileUrl === 'function') {
                return api.fileUrl(rawUrl);
            }
            const cleanPath = rawUrl.startsWith('/') ? rawUrl : '/' + rawUrl;
            const baseUrl = api.baseUrl ? api.baseUrl.replace(/\/$/, '') : '';
            return `${baseUrl}${cleanPath}`;
        }

        async function injecterComposants() {
            try {
                const resSidebar = await fetch('sidebar.html');
                if (resSidebar.ok) {
                    document.getElementById('sidebar-injector').innerHTML = await resSidebar.text();
                    initSidebar(auth);
                }
                const resNavbar = await fetch('navbar.html');
                if (resNavbar.ok) {
                    document.getElementById('navbar-injector').innerHTML = await resNavbar.text();
                    if (auth.currentUser) chargerProfilNavbar(null, auth.currentUser);
                }
            } catch (e) {
                console.error("Erreur d'injection des composants:", e);
            }
        }

        // Chargement du profil utilisateur depuis Cloudflare D1/D3 via l'API
        async function chargerInfosCompte() {
            if (!targetUserId) {
                alert("Aucun identifiant de compte spécifié dans l'URL.");
                return;
            }

            try {
                // Appel API REST D1/D3
                const user = await api.get(`/api/users/${targetUserId}`);

                if (!user || user.error) {
                    document.getElementById('header-user-name').textContent = "Utilisateur introuvable";
                    return;
                }

                // Remplir le formulaire
                fields.forEach(field => {
                    const input = document.getElementById(field);
                    if (input) {
                        input.value = user[field] !== undefined && user[field] !== null ? user[field] : "";
                    }
                });

                // Remplir l'en-tête
                const name = user.fullName || `${user.firstName || ''} ${user.lastName || ''}`.trim() || user.displayName || "Utilisateur";
                document.getElementById('header-user-name').textContent = name;
                document.getElementById('header-user-email').textContent = user.email || "Sans email";

                // Afficher l'avatar
                const avatarContainer = document.getElementById('avatar-container');
                const avatarUrl = formerUrlComplet(user.photoURL || user.photo);

                if (avatarUrl) {
                    avatarContainer.innerHTML = `<img src="${avatarUrl}" alt="Avatar" onerror="this.onerror=null; this.parentNode.innerHTML='<span>${name.charAt(0).toUpperCase()}</span>';">`;
                } else {
                    avatarContainer.innerHTML = `<span>${name.charAt(0).toUpperCase() || "U"}</span>`;
                }

                // Charger les contenus D1/D3 associés
                chargerSorties();
                chargerArtistes();

            } catch (err) {
                console.error("Erreur de chargement du profil D1/D3 :", err);
                document.getElementById('header-user-name').textContent = "Erreur de chargement";
            }
        }

        // Enregistrement des modifications vers D1/D3
        document.getElementById('user-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusDiv = document.getElementById('save-status');
            statusDiv.style.display = 'block';
            statusDiv.style.color = '#64748b';
            statusDiv.textContent = "Mise à jour en cours dans la base de données...";

            try {
                const updateData = {};
                fields.forEach(field => {
                    const val = document.getElementById(field).value.trim();
                    updateData[field] = val;
                });

                // Appel PATCH vers l'API Worker
                await api.patch(`/api/users/${targetUserId}`, updateData);

                statusDiv.style.color = '#10b981';
                statusDiv.textContent = "Modifications enregistrées avec succès dans D3/D1 !";
                setTimeout(() => statusDiv.style.display = 'none', 3000);

            } catch (err) {
                console.error("Erreur de mise à jour :", err);
                statusDiv.style.color = '#ef4444';
                statusDiv.textContent = "Erreur lors de la sauvegarde.";
            }
        });

        // Chargement des sorties
        async function chargerSorties() {
            const grid = document.getElementById('releases-grid');
            try {
                const res = await api.get(`/api/users/${targetUserId}/releases`);
                const releases = Array.isArray(res) ? res : (res.releases || res.data || []);

                if (!releases || releases.length === 0) {
                    grid.innerHTML = `<p style="color: #64748b; font-size: 14px;">Aucune sortie trouvée pour cet utilisateur.</p>`;
                    return;
                }

                grid.innerHTML = releases.map(rel => {
                    const relId = rel.id;
                    const title = rel.title || rel.titre || "Sans titre";
                    const cover = formerUrlComplet(rel.coverUrl || rel.cover_url || rel.cover) || DEFAULT_COVER;
                    const type = rel.type || rel.format || "Single";

                    return `
                <div class="item-card release-item" data-id="${relId}">
                    <img src="${cover}" class="item-cover" alt="${title}" onerror="this.src='${DEFAULT_COVER}'">
                    <div class="item-title" title="${title}">${title}</div>
                    <div class="item-sub">${type}</div>
                </div>
            `;
                }).join('');

                document.querySelectorAll('.release-item').forEach(card => {
                    card.addEventListener('click', () => {
                        const releaseId = card.getAttribute('data-id');
                        if (releaseId) window.location.href = `sortie.html?id=${releaseId}`;
                    });
                });

            } catch (e) {
                console.error("Erreur de chargement des sorties :", e);
                grid.innerHTML = `<p style="color: #ef4444; font-size: 14px;">Erreur de chargement des sorties.</p>`;
            }
        }

        // Chargement des artistes
        async function chargerArtistes() {
            const grid = document.getElementById('artists-grid');
            try {
                const res = await api.get(`/api/users/${targetUserId}/artists`);
                const artists = Array.isArray(res) ? res : (res.artists || res.data || []);

                if (!artists || artists.length === 0) {
                    grid.innerHTML = `<p style="color: #64748b; font-size: 14px;">Aucun artiste associé.</p>`;
                    return;
                }

                grid.innerHTML = artists.map(art => {
                    const artistId = art.id;
                    const name = art.name || art.artistName || "Artiste";
                    const pdp = formerUrlComplet(art.photo || art.photoURL || art.image) || DEFAULT_COVER;

                    return `
                <div class="item-card artist-item" data-id="${artistId}">
                    <img src="${pdp}" class="item-cover" style="border-radius:50%;" alt="${name}" onerror="this.src='${DEFAULT_COVER}'">
                    <div class="item-title" title="${name}">${name}</div>
                </div>
            `;
                }).join('');

                document.querySelectorAll('.artist-item').forEach(card => {
                    card.addEventListener('click', () => {
                        const artistId = card.getAttribute('data-id');
                        if (artistId) window.location.href = `artiste.html?id=${artistId}`;
                    });
                });

            } catch (e) {
                console.error("Erreur de chargement des artistes :", e);
                grid.innerHTML = `<p style="color: #ef4444; font-size: 14px;">Erreur de chargement des artistes.</p>`;
            }
        }

        // Initialisation
        injecterComposants();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                chargerProfilNavbar(null, user);
                chargerInfosCompte();
            } else {
                window.location.href = "/login.html";
            }
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Sorties | MMCP Admin</title>
    <link rel="stylesheet" href="admin.css">
    <style>
        .page-header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }

        .search-bar-container {
            position: relative;
            min-width: 280px;
        }

        .search-input {
            width: 100%;
            padding: 10px 16px;
            border-radius: 34px;
            background-color: rgba(232, 232, 232, 0.349);
            backdrop-filter: blur(62px);
            -webkit-backdrop-filter: blur(62px);
            border: 1px solid rgba(189, 189, 189, 0.438);
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.268);
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #FC8FB0;
        }

        .table-card {
            padding: 20px;
            background-color: rgba(232, 232, 232, 0.349);
            backdrop-filter: blur(62px);
            -webkit-backdrop-filter: blur(62px);
            border: 1px solid rgba(189, 189, 189, 0.438);
            border-radius: 34px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.268);
            overflow-x: auto;
        }

        .releases-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            color: #000000;
            font-size: 14px;
        }

        .releases-table th {
            padding: 14px 16px;
            border-bottom: 1px solid #000000;
            color: #444444;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .releases-table td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(30, 41, 59, 0.15);
            vertical-align: middle;
        }

        .releases-table tbody tr {
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .releases-table tbody tr:hover {
            background: #fc8fb051 !important;
        }

        .release-cell-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .release-cover-thumb {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            object-fit: cover;
            background-color: #e2e8f0;
            border: 1px solid rgba(189, 189, 189, 0.438);
            flex-shrink: 0;
        }

        .badge-status {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            display: inline-block;
            text-transform: uppercase;
        }

        .status-direct {
            background: rgba(16, 185, 129, 0.15);
            color: #059669;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-verification {
            background: rgba(245, 158, 11, 0.15);
            color: #d97706;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .status-livree {
            background: rgba(59, 130, 246, 0.15);
            color: #2563eb;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .status-retrait {
            background: rgba(239, 68, 68, 0.15);
            color: #dc2626;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .status-brouillon {
            background: rgba(100, 116, 139, 0.15);
            color: #475569;
            border: 1px solid rgba(100, 116, 139, 0.3);
        }

        .table-loading {
            text-align: center;
            padding: 40px !important;
            color: #64748b;
        }

        .upc-code {
            background: #0f172a;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #334155;
            font-family: monospace;
            font-size: 12px;
            color: #cbd5e1;
        }
    </style>
</head>

<body>

    <div class="admin-wrapper">
        <!-- Sidebar fixe à gauche -->
        <aside id="sidebar-injector" class="sidebar-container"></aside>

        <!-- Contenu principal à droite -->
        <main class="main-container">

            <header id="navbar-injector" class="navbar-container"></header>

            <div class="page-header-actions">
                <div>
                    <h2 class="page-title" style="margin: 0;">Gestion des Sorties</h2>
                    <p style="color: #64748b; font-size: 14px; margin-top: 4px;">
                        Liste intégrale des sorties du catalogue MMCP.
                    </p>
                </div>

                <div class="search-bar-container">
                    <input type="text" id="release-search-input" class="search-input"
                        placeholder="Rechercher titre, artiste, UPC..." />
                </div>
            </div>

            <div class="table-card">
                <table class="releases-table">
                    <thead>
                        <tr>
                            <th>Titre</th>
                            <th>Artiste</th>
                            <th>Format</th>
                            <th>Code UPC</th>
                            <th>Statut</th>
                            <th>Date de Sortie</th>
                        </tr>
                    </thead>
                    <tbody id="releases-table-body">
                        <tr>
                            <td colspan="6" class="table-loading">
                                <span>Chargement de toutes les sorties...</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </main>
    </div>

    <script type="module">
        import { auth } from "/assets/js/firebase.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
        import { api } from "/assets/js/api.js";
        import { initSidebar } from "./sidebar.js";
        import { chargerProfilNavbar } from "./navbar.js";

        let listReleasesCache = [];

        const DEFAULT_COVER = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300"><rect width="100%" height="100%" fill="%23e2e8f0"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="16" fill="%2364748b">Pas d'image</text></svg>`;

        function obtenirUrlPochette(rawUrl) {
            if (!rawUrl) return DEFAULT_COVER;
            if (rawUrl.startsWith('http://') || rawUrl.startsWith('https://') || rawUrl.startsWith('data:')) {
                return rawUrl;
            }
            if (typeof api.fileUrl === 'function') {
                return api.fileUrl(rawUrl);
            }
            const cleanPath = rawUrl.startsWith('/') ? rawUrl : '/' + rawUrl;
            const baseUrl = api.baseUrl ? api.baseUrl.replace(/\/$/, '') : '';
            return `${baseUrl}${cleanPath}`;
        }

        async function injecterComposants() {
            try {
                const resSidebar = await fetch('sidebar.html');
                if (resSidebar.ok) {
                    document.getElementById('sidebar-injector').innerHTML = await resSidebar.text();
                    initSidebar(auth);

                    const links = document.querySelectorAll('.sidebar-link');
                    links.forEach(l => {
                        if (l.getAttribute('href') === 'sorties.html') {
                            l.classList.add('active');
                        } else {
                            l.classList.remove('active');
                        }
                    });
                }

                const resNavbar = await fetch('navbar.html');
                if (resNavbar.ok) {
                    document.getElementById('navbar-injector').innerHTML = await resNavbar.text();
                    if (auth.currentUser) chargerProfilNavbar(null, auth.currentUser);
                }
            } catch (e) {
                console.error("Erreur injection composants : ", e);
            }
        }

        async function chargerToutesLesSorties() {
            const tbody = document.getElementById("releases-table-body");

            try {
                // Utilisation du point d'entrée d'administration pour récupérer TOUTES les sorties sans filtre de statut
                const releasesList = await api.get("/api/releases");

                // Déstructuration robuste (supporte tableau direct, { releases: [...] }, ou { data: [...] })
                const rawData = Array.isArray(releasesList) ? releasesList : (releasesList.releases || releasesList.data || []);
                listReleasesCache = Array.isArray(rawData) ? rawData : [];

                // Affichage direct sans filtrer sur le statut (toutes les sorties sont visibles pour l'admin)
                afficherTableauSorties(listReleasesCache);
            } catch (err) {
                console.error("Erreur chargement des sorties :", err);
                tbody.innerHTML = `<tr><td colspan="6" class="table-loading" style="color:#ef4444;">Erreur lors du chargement des sorties du catalogue.</td></tr>`;
            }
        }

        function afficherTableauSorties(liste) {
            const tbody = document.getElementById("releases-table-body");
            if (!liste || liste.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="table-loading">Aucune sortie trouvée dans le catalogue.</td></tr>`;
                return;
            }

            tbody.innerHTML = liste.map(rel => {
                const title = rel.title || rel.titre || "Sans titre";
                const artist = rel.artistName || rel.artist || rel.artiste || "Artiste inconnu";
                const format = rel.format || rel.type || "Single";
                const upc = rel.upc || "—";
                const status = rel.status || "Vérification MMCP";
                const releaseDate = rel.releaseDate || rel.dateRelease || "—";
                const coverUrl = obtenirUrlPochette(rel.coverUrl || rel.cover_url || rel.pochetteUrl || rel.cover);

                // Normalisation des badges de statuts d'administration
                let badgeClass = "status-verification";
                const statusLower = String(status).toLowerCase();

                if (statusLower === "direct" || statusLower === "publié" || statusLower === "live") badgeClass = "status-direct";
                else if (statusLower === "livrée" || statusLower === "livre" || statusLower === "valide") badgeClass = "status-livree";
                else if (statusLower === "retrait" || statusLower === "retiré") badgeClass = "status-retrait";
                else if (statusLower === "brouillon") badgeClass = "status-brouillon";

                return `
            <tr class="release-row" data-id="${rel.id}">
                <td>
                    <div class="release-cell-title">
                        <img class="release-cover-thumb" src="${coverUrl}" alt="${title}">
                        <strong>${title}</strong>
                    </div>
                </td>
                <td>${artist}</td>
                <td>${format}</td>
                <td><span class="upc-code">${upc}</span></td>
                <td><span class="badge-status ${badgeClass}">${status}</span></td>
                <td style="color: #64748b;">${releaseDate}</td>
            </tr>
        `;
            }).join("");

            // Secours image cassée
            document.querySelectorAll('.release-cover-thumb').forEach(img => {
                img.addEventListener('error', () => {
                    img.src = DEFAULT_COVER;
                });
            });

            // Redirection au clic sur une ligne vers l'édition/vue détaillée
            document.querySelectorAll('.release-row').forEach(row => {
                row.addEventListener('click', () => {
                    const releaseId = row.getAttribute('data-id');
                    if (releaseId) {
                        window.location.href = `sortie.html?id=${releaseId}`;
                    }
                });
            });
        }

        // Recherche en temps réel
        document.getElementById("release-search-input").addEventListener("input", (e) => {
            const searchVal = e.target.value.toLowerCase().trim();
            const filtered = listReleasesCache.filter(r => {
                const title = (r.title || r.titre || "").toLowerCase();
                const artist = (r.artistName || r.artist || r.artiste || "").toLowerCase();
                const upc = (r.upc || "").toLowerCase();
                return title.includes(searchVal) || artist.includes(searchVal) || upc.includes(searchVal);
            });
            afficherTableauSorties(filtered);
        });

        injecterComposants();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (typeof db !== "undefined") {
                    chargerProfilNavbar(db, user);
                } else {
                    chargerProfilNavbar(null, user);
                }
                chargerToutesLesSorties();
            } else {
                window.location.href = "/login.html";
            }
        });
    </script>
</body>

</html>

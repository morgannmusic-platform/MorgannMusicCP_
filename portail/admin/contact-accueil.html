<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réception des Messages | MMCP Admin</title>
    <link rel="stylesheet" href="admin.css">
    <style>
        .page-header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }

        .search-bar-container {
            position: relative;
            min-width: 280px;
        }

        .search-input {
            width: 100%;
            margin-top: 50px;
            padding: 10px 16px;
            border-radius: 10px;
            background-color: rgba(232, 232, 232, 0.349);
            backdrop-filter: blur(62px);
            -webkit-backdrop-filter: blur(62px);
            border: 1px solid rgba(189, 189, 189, 0.438);
            border-radius: 34px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.268);
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #FC8FB0;
        }

        .table-card {
            padding: 20px;
            background-color: rgba(232, 232, 232, 0.349);
            backdrop-filter: blur(62px);
            -webkit-backdrop-filter: blur(62px);
            border: 1px solid rgba(189, 189, 189, 0.438);
            border-radius: 34px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.268);
            overflow-x: auto;
        }

        .messages-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            color: #000000;
            font-size: 14px;
        }

        .messages-table th {
            padding: 14px 16px;
            border-bottom: 1px solid #000000;
            color: #444444;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .messages-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #1e293b;
            vertical-align: middle;
        }

        .messages-table tbody tr {
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .messages-table tbody tr:hover {
            background: #fc8fb051 !important;
        }

        .table-loading {
            text-align: center;
            padding: 40px !important;
            color: #94a3b8;
        }

        .email-badge {
            background: #0f172a;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #334155;
            font-family: monospace;
            font-size: 12px;
            color: #cbd5e1;
        }

        .message-preview {
            max-width: 400px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #333333;
        }

        /* Styles de la modale (Pop-up) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: #ffffff;
            border-radius: 24px;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            transform: translateY(20px);
            transition: transform 0.3s ease;
            position: relative;
            color: #1e293b;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 15px;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 1.25rem;
            color: #0f172a;
        }

        .modal-close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #64748b;
            transition: color 0.2s;
        }

        .modal-close-btn:hover {
            color: #0f172a;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-field-group label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            font-weight: 700;
            display: block;
            margin-bottom: 4px;
        }

        .modal-field-group .modal-value {
            font-size: 15px;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            word-break: break-word;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .modal-footer {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .modal-action-btn {
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            border: none;
            transition: opacity 0.2s;
        }

        .modal-action-btn.primary {
            background: #FC8FB0;
            color: #ffffff;
        }

        .modal-action-btn.secondary {
            background: #e2e8f0;
            color: #334155;
        }

        .modal-action-btn:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <div class="admin-wrapper">
        <!-- Sidebar fixe à gauche -->
        <aside id="sidebar-injector" class="sidebar-container"></aside>

        <!-- Contenu principal à droite -->
        <main class="main-container">

            <header id="navbar-injector" class="navbar-container"></header>

            <div class="page-header-actions">
                <div>
                    <h2 class="page-title" style="margin: 0;">Réception des Messages</h2>
                    <p style="color: #94a3b8; font-size: 14px; margin-top: 4px;">Liste des messages envoyés depuis le
                        formulaire de contact du site.</p>
                </div>

                <div class="search-bar-container">
                    <input type="text" id="message-search-input" class="search-input"
                        placeholder="Rechercher email, message..." />
                </div>
            </div>

            <div class="table-card">
                <table class="messages-table">
                    <thead>
                        <tr>
                            <th>Nom / Expéditeur</th>
                            <th>E-mail</th>
                            <th>Message</th>
                            <th>Date de réception</th>
                        </tr>
                    </thead>
                    <tbody id="messages-table-body">
                        <tr>
                            <td colspan="4" class="table-loading">
                                <span>Chargement des messages...</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </main>
    </div>

    <!-- Modale (Pop-up) pour afficher le message en grand -->
    <div id="message-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Détails du message</h3>
                <button class="modal-close-btn" id="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-field-group">
                    <label>Nom</label>
                    <div class="modal-value" id="modal-name">—</div>
                </div>
                <div class="modal-field-group">
                    <label>Expéditeur (E-mail)</label>
                    <div class="modal-value" id="modal-email">—</div>
                </div>
                <div class="modal-field-group">
                    <label>Date de réception</label>
                    <div class="modal-value" id="modal-date">—</div>
                </div>
                <div class="modal-field-group">
                    <label>Message complet</label>
                    <div class="modal-value" id="modal-text" style="max-height: 250px; overflow-y: auto;">—</div>
                </div>
            </div>
            <div class="modal-footer">
                <a id="modal-mailto" href="#" class="modal-action-btn primary">Répondre par e-mail</a>
                <button class="modal-action-btn secondary" id="modal-close-action">Fermer</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth } from "/assets/js/firebase.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
        import { api } from "/assets/js/api.js";
        import { initSidebar } from "./sidebar.js";
        import { chargerProfilNavbar } from "./navbar.js";

        let listMessagesCache = [];

        async function injecterComposants() {
            try {
                const resSidebar = await fetch('sidebar.html');
                if (resSidebar.ok) {
                    document.getElementById('sidebar-injector').innerHTML = await resSidebar.text();
                    initSidebar(auth);

                    const links = document.querySelectorAll('.sidebar-link');
                    links.forEach(l => {
                        if (l.getAttribute('href') === 'contact-accueil.html') {
                            l.classList.add('active');
                        } else {
                            l.classList.remove('active');
                        }
                    });
                }

                const resNavbar = await fetch('navbar.html');
                if (resNavbar.ok) {
                    document.getElementById('navbar-injector').innerHTML = await resNavbar.text();
                    if (auth.currentUser) chargerProfilNavbar(null, auth.currentUser);
                }
            } catch (e) {
                console.error("Erreur injection composants : ", e);
            }
        }

        async function chargerTousLesMessages() {
            const tbody = document.getElementById("messages-table-body");

            try {
                // Utilisation du client API centralisé pour récupérer les messages depuis D1 via le Cloudflare Worker
                const messages = await api.get("/api/admin/messages");
                listMessagesCache = Array.isArray(messages) ? messages : [];

                afficherTableauMessages(listMessagesCache);
            } catch (err) {
                console.error("Erreur chargement messages:", err);
                tbody.innerHTML = `<tr><td colspan="4" class="table-loading" style="color:#ef4444;">Erreur lors du chargement des messages.</td></tr>`;
            }
        }

        function afficherTableauMessages(liste) {
            const tbody = document.getElementById("messages-table-body");
            if (liste.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="table-loading">Aucun message trouvé.</td></tr>`;
                return;
            }

            tbody.innerHTML = liste.map(msg => {
                const name = msg.name || "Anonyme";
                const email = msg.email || "Inconnu";
                const messageText = msg.message || "—";

                let dateStr = "—";
                if (msg.created_at) {
                    dateStr = new Date(msg.created_at).toLocaleString("fr-FR");
                }

                return `
            <tr class="message-row" data-id="${msg.id}">
                <td style="font-weight: 600; color: #0f172a;">${name}</td>
                <td><span class="email-badge">${email}</span></td>
                <td><div class="message-preview">${messageText}</div></td>
                <td style="color: #94a3b8;">${dateStr}</td>
            </tr>
        `;
            }).join("");

            // Gestion du clic pour ouvrir la modale
            document.querySelectorAll('.message-row').forEach(row => {
                row.addEventListener('click', () => {
                    const messageId = row.getAttribute('data-id');
                    const selectedMsg = listMessagesCache.find(m => String(m.id) === String(messageId));
                    if (selectedMsg) {
                        ouvrirModaleMessage(selectedMsg);
                    }
                });
            });
        }

        // Fonctions pour gérer la modale
        const modalOverlay = document.getElementById("message-modal");
        const closeModalBtn = document.getElementById("close-modal");
        const closeModalActionBtn = document.getElementById("modal-close-action");

        function ouvrirModaleMessage(msg) {
            document.getElementById("modal-name").textContent = msg.name || "Anonyme";
            document.getElementById("modal-email").textContent = msg.email || "Inconnu";

            let dateStr = "—";
            if (msg.created_at) {
                dateStr = new Date(msg.created_at).toLocaleString("fr-FR");
            }
            document.getElementById("modal-date").textContent = dateStr;
            document.getElementById("modal-text").textContent = msg.message || "Aucun contenu";

            document.getElementById("modal-mailto").href = `mailto:${msg.email}?subject=Réponse à votre message - Morgann Music CP`;

            modalOverlay.classList.add("active");
        }

        function fermerModaleMessage() {
            modalOverlay.classList.remove("active");
        }

        closeModalBtn.addEventListener("click", fermerModaleMessage);
        closeModalActionBtn.addEventListener("click", fermerModaleMessage);
        modalOverlay.addEventListener("click", (e) => {
            if (e.target === modalOverlay) fermerModaleMessage();
        });

        document.getElementById("message-search-input").addEventListener("input", (e) => {
            const searchVal = e.target.value.toLowerCase().trim();
            const filtered = listMessagesCache.filter(m => {
                const name = (m.name || "").toLowerCase();
                const email = (m.email || "").toLowerCase();
                const message = (m.message || "").toLowerCase();
                return name.includes(searchVal) || email.includes(searchVal) || message.includes(searchVal);
            });
            afficherTableauMessages(filtered);
        });

        injecterComposants();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                chargerProfilNavbar(null, user);
                chargerTousLesMessages();
            }
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Admin - Uploader Sortie | MMCP Admin</title>
    <link rel="stylesheet" href="admin.css">
    <style>
        .details-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .card {
            background-color: rgba(232, 232, 232, 0.349);
            backdrop-filter: blur(62px);
            -webkit-backdrop-filter: blur(62px);
            border: 1px solid rgba(189, 189, 189, 0.438);
            border-radius: 34px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.268);
            padding: 24px;
            margin-top: 50px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 12px;
            text-transform: uppercase;
            color: #404040;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .form-control {
            background-color: rgba(232, 232, 232, 0.349);
            backdrop-filter: blur(62px);
            -webkit-backdrop-filter: blur(62px);
            border: 1px solid rgba(189, 189, 189, 0.438);
            border-radius: 34px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.268);
            padding: 10px 12px;
            color: #000000;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #d01159;
        }

        .track-box {
            background-color: rgba(232, 232, 232, 0.349);
            backdrop-filter: blur(62px);
            -webkit-backdrop-filter: blur(62px);
            border: 1px solid rgba(189, 189, 189, 0.438);
            border-radius: 34px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.268);
            padding: 20px;
            margin-bottom: 16px;
        }

        .track-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .btn-delete-track {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-delete-track:hover {
            background: #dc2626;
        }

        .btn-add-track {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 20px;
            transition: background 0.2s;
        }

        .btn-add-track:hover {
            background: #059669;
        }

        .btn-save {
            background: #FC8FB0;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 25px;
            font-size: 16px;
            transition: background 0.2s;
        }

        .btn-save:hover {
            background: #d87a96;
        }

        .btn-secondary {
            background: #334155;
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .progress-bar-container {
            width: 100%;
            background-color: rgba(232, 232, 232, 0.349);
            backdrop-filter: blur(62px);
            -webkit-backdrop-filter: blur(62px);
            border: 1px solid rgba(189, 189, 189, 0.438);
            border-radius: 34px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.268);
            margin-top: 15px;
            display: none;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 18px;
            background-color: #d01159;
            text-align: center;
            line-height: 18px;
            color: white;
            font-size: 11px;
            font-weight: bold;
            transition: width 0.3s;
        }

        .cover-preview {
            max-width: 150px;
            max-height: 150px;
            margin-top: 10px;
            border-radius: 30px;
            display: none;
            border: 1px solid #334155;
        }
    </style>
</head>

<body>

    <div class="admin-wrapper">
        <aside id="sidebar-injector" class="sidebar-container"></aside>

        <main class="main-container">
            <header id="navbar-injector" class="navbar-container"></header>

            <div class="details-container">
                <div class="card">
                    <h2 style="margin:0; color:#000000;">Créer & Uploader une Sortie (Mode Admin D1)</h2>
                    <p style="color: #434343; font-size: 14px; margin-top: 4px; margin-bottom: 24px;">
                        Sélectionne un utilisateur, gère ses artistes et importe les fichiers média avec découpe
                        automatique (5 Mo/chunk).
                    </p>

                    <!-- ÉTAPE 1: SELECTION COMPTE ET ARTISTE -->
                    <h3 style="color:#000000; margin-bottom: 0;">1. Propriétaire & Artiste</h3>
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label>Compte Utilisateur cible</label>
                            <select id="select-user" class="form-control" onchange="chargerArtistesUtilisateur()">
                                <option value="">-- Sélectionner un utilisateur --</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Artiste Principal</label>
                            <select id="select-artist" class="form-control">
                                <option value="">-- Sélectionner un compte d'abord --</option>
                            </select>
                        </div>

                        <div class="form-group" style="justify-content: flex-end;">
                            <button type="button" class="btn-secondary" onclick="afficherBlocNouvelArtiste()">+ Nouvel
                                Artiste pour ce compte</button>
                        </div>

                        <div class="form-group full-width" id="block-new-artist"
                            style="display:none; background:#ffffff45; padding:15px; border-radius:30px; border:1px solid #969696;">
                            <label style="color:#000000;">Créer un nouvel artiste pour cet utilisateur</label>
                            <div style="display:flex; gap:10px; margin-top:8px;">
                                <input type="text" id="new-artist-name" class="form-control"
                                    placeholder="Nom de l'artiste">
                                <button type="button" class="btn-add-track" style="margin:0; white-space:nowrap;"
                                    onclick="creerNouvelArtiste()">Enregistrer l'artiste</button>
                            </div>
                        </div>
                    </div>

                    <!-- ÉTAPE 2: METADONNEES DE LA RELEASE -->
                    <h3 style="color:#000000; margin-top: 32px; margin-bottom: 0;">2. Métadonnées de la Release</h3>
                    <div class="form-grid">
                        <div class="form-group"><label>Titre de la sortie</label><input type="text" id="edit-title"
                                class="form-control"></div>
                        <div class="form-group"><label>Version (Version Line)</label><input type="text"
                                id="edit-versionLine" class="form-control" placeholder="ex: Remastered, Deluxe...">
                        </div>
                        <div class="form-group"><label>Type</label>
                            <select id="edit-type" class="form-control">
                                <option value="Single">Single</option>
                                <option value="EP">EP</option>
                                <option value="Album">Album</option>
                            </select>
                        </div>
                        <div class="form-group"><label>Format</label><input type="text" id="edit-format"
                                class="form-control" value="Digital"></div>
                        <div class="form-group"><label>Statut initial</label>
                            <select id="edit-status" class="form-control">
                                <option value="verification mmcp">Vérification MMCP</option>
                                <option value="verification plate-formes">Vérification Plate-formes</option>
                                <option value="livrée">Livrée</option>
                                <option value="direct">Direct</option>
                            </select>
                        </div>
                        <div class="form-group"><label>Code UPC</label><input type="text" id="edit-upc"
                                class="form-control" oninput="verifierEtGenererCatalog()"></div>
                        <div class="form-group"><label>Code Catalogue MMCP</label><input type="text"
                                id="edit-catalogNumber" class="form-control" readonly
                                style="background:#ffffff; font-weight:bold; color:#FC8FB0;"></div>
                        <div class="form-group"><label>Label</label><input type="text" id="edit-label"
                                class="form-control" value="Morgann Music CP"></div>
                        <div class="form-group"><label>Genre Principal</label><input type="text" id="edit-primaryGenre"
                                class="form-control"></div>
                        <div class="form-group"><label>Genre Secondaire</label><input type="text"
                                id="edit-secondaryGenre" class="form-control"></div>
                        <div class="form-group"><label>Langue</label><input type="text" id="edit-language"
                                class="form-control" value="French"></div>
                        <div class="form-group"><label>Date de Sortie</label><input type="date" id="edit-releaseDate"
                                class="form-control"></div>

                        <!-- IMPORTATION DE LA POCHETTE -->
                        <div class="form-group full-width"
                            style="background:rgba(209, 209, 209, 0.395); padding:15px; border-radius:30px; border:1px solid #fefefe69;">
                            <label style="color:#FC8FB0;">Pochette de l'album / single (Importation fichier)</label>
                            <input type="file" id="file-cover" accept="image/*" class="form-control"
                                onchange="previewPochette(event)">
                            <img id="cover-preview-img" class="cover-preview" alt="Aperçu pochette">
                        </div>
                    </div>

                    <!-- ÉTAPE 3: PISTES ET FICHIERS AUDIO -->
                    <h3 style="color:#000000; margin-top: 32px; margin-bottom: 12px;">3. Pistes & Fichiers Audio</h3>
                    <div id="admin-tracks-list"></div>

                    <button type="button" class="btn-add-track" onclick="ajouterPiste()">+ Ajouter une piste</button>

                    <!-- BARRE DE PROGRESSION DE L'UPLOAD -->
                    <div class="progress-bar-container" id="progress-container">
                        <div class="progress-bar" id="progress-bar">0%</div>
                    </div>

                    <button class="btn-save" id="btn-submit" onclick="creerEtUploaderSortie()">Uploader les fichiers par
                        paquets & Enregistrer dans D1</button>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { auth } from "/assets/js/firebase.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
        import { api } from "/assets/js/api.js";
        import { initSidebar } from "./sidebar.js";
        import { chargerProfilNavbar } from "./navbar.js";

        let pistesActuelles = [];
        let listeUtilisateurs = {};

        // Résolution dynamique de l'URL de l'API Worker
        function getApiBaseUrl() {
            if (api && api.baseUrl && (api.baseUrl.startsWith('http://') || api.baseUrl.startsWith('https://'))) {
                return api.baseUrl.replace(/\/$/, '');
            }
            // Si exécuté sur Live Server local (127.0.0.1:5500), cibler le Worker Cloudflare
            if (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') {
                return 'https://mon-site-api.morgann-rachedi.workers.dev';
            }
            return (api && api.baseUrl) ? api.baseUrl.replace(/\/$/, '') : '';
        }

        async function injecterComposants() {
            try {
                const resSidebar = await fetch('sidebar.html');
                if (resSidebar.ok) {
                    document.getElementById('sidebar-injector').innerHTML = await resSidebar.text();
                    initSidebar(auth);
                }

                const resNavbar = await fetch('navbar.html');
                if (resNavbar.ok) {
                    document.getElementById('navbar-injector').innerHTML = await resNavbar.text();
                    if (auth.currentUser) chargerProfilNavbar(null, auth.currentUser);
                }
            } catch (e) {
                console.error("Erreur injection composants : ", e);
            }
        }

        injecterComposants();

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "/login.html"; return; }

            chargerProfilNavbar(null, user);

            try {
                await chargerListeUtilisateurs();
                ajouterPiste();
            } catch (err) { console.error(err); }
        });

        // Charger tous les comptes de la base D1
        async function chargerListeUtilisateurs() {
            const selectUser = document.getElementById("select-user");
            selectUser.innerHTML = `<option value="">-- Sélectionner un utilisateur --</option>`;

            try {
                let usersRes;
                try {
                    usersRes = await api.get("/api/admin/users");
                } catch (e) {
                    usersRes = await api.get("/api/users");
                }

                const usersList = Array.isArray(usersRes) ? usersRes : (usersRes.users || usersRes.data || []);

                usersList.forEach(u => {
                    const userId = u.uid || u.id;
                    listeUtilisateurs[userId] = u;
                    const opt = document.createElement("option");
                    opt.value = userId;
                    const name = `${u.firstName || ''} ${u.lastName || ''}`.trim() || u.fullName || u.email || userId;
                    opt.textContent = `${name} (${u.email || 'Sans mail'})`;
                    selectUser.appendChild(opt);
                });
            } catch (e) {
                console.error("Erreur chargement liste utilisateurs :", e);
            }
        }

        window.chargerArtistesUtilisateur = async function () {
            const userId = document.getElementById("select-user").value;
            const selectArtist = document.getElementById("select-artist");
            selectArtist.innerHTML = `<option value="">-- Sélectionner un artiste --</option>`;

            if (!userId) return;

            try {
                const res = await api.get(`/api/users/${userId}/artists`);
                const artistsList = Array.isArray(res) ? res : (res.artists || res.data || []);

                artistsList.forEach(art => {
                    const opt = document.createElement("option");
                    opt.value = art.name || art.artistName || art.id;
                    opt.textContent = art.name || art.artistName || art.id;
                    selectArtist.appendChild(opt);
                });
            } catch (e) {
                console.error("Erreur chargement artistes utilisateur :", e);
            }
        };

        window.afficherBlocNouvelArtiste = function () {
            const userId = document.getElementById("select-user").value;
            if (!userId) { alert("Sélectionne d'abord un utilisateur dans la liste !"); return; }
            document.getElementById("block-new-artist").style.display = "block";
        };

        window.creerNouvelArtiste = async function () {
            const userId = document.getElementById("select-user").value;
            const artistName = document.getElementById("new-artist-name").value.trim();

            if (!artistName) { alert("Saisis un nom d'artiste."); return; }

            try {
                await api.post(`/api/users/${userId}/artists`, { name: artistName });
                alert(`Artiste "${artistName}" créé avec succès !`);
                document.getElementById("new-artist-name").value = "";
                document.getElementById("block-new-artist").style.display = "none";
                await chargerArtistesUtilisateur();
                document.getElementById("select-artist").value = artistName;
            } catch (e) { alert("Erreur lors de la création : " + e.message); }
        };

        window.verifierEtGenererCatalog = function () {
            const upcVal = document.getElementById("edit-upc").value.trim();
            const catEl = document.getElementById("edit-catalogNumber");
            if (upcVal.length > 0 && (!catEl.value || catEl.value === "-")) {
                let rands = "";
                for (let i = 0; i < 10; i++) rands += Math.floor(Math.random() * 10);
                catEl.value = "MMCP" + rands;
            }
        };

        window.previewPochette = function (e) {
            const file = e.target.files[0];
            const img = document.getElementById("cover-preview-img");
            if (file) {
                img.src = URL.createObjectURL(file);
                img.style.display = "block";
            } else {
                img.style.display = "none";
            }
        };

        function capturerSaisiesPistes() {
            pistesActuelles.forEach((t, i) => {
                const elTitle = document.getElementById(`t-title-${i}`);
                if (!elTitle) return;

                pistesActuelles[i].title = elTitle.value;
                pistesActuelles[i].version = document.getElementById(`t-version-${i}`).value;
                pistesActuelles[i].isrc = document.getElementById(`t-isrc-${i}`).value.trim();
                pistesActuelles[i].writers = document.getElementById(`t-writers-${i}`).value;
                pistesActuelles[i].lyricsText = document.getElementById(`t-lyrics-${i}`).value;
            });
        }

        function afficherPistesHTML() {
            const container = document.getElementById("admin-tracks-list");
            container.innerHTML = "";

            pistesActuelles.forEach((t, i) => {
                const box = document.createElement("div");
                box.className = "track-box";
                box.innerHTML = `
                    <div class="track-header">
                        <div style="font-weight:bold; color:#d01159;">Piste ${i + 1} : ${t.title || 'Sans titre'}</div>
                        ${pistesActuelles.length > 1 ? `<button type="button" class="btn-delete-track" onclick="supprimerPiste(${i})">Supprimer cette piste</button>` : ''}
                    </div>
                    <div class="form-grid">
                        <div class="form-group"><label>Titre de la Piste</label><input type="text" id="t-title-${i}" class="form-control" value="${t.title || ''}"></div>
                        <div class="form-group"><label>Version</label><input type="text" id="t-version-${i}" class="form-control" value="${t.version || ''}"></div>
                        <div class="form-group"><label>Code ISRC</label><input type="text" id="t-isrc-${i}" class="form-control" value="${t.isrc || ''}" placeholder="Auto ou Manuel"></div>
                        <div class="form-group"><label>Auteurs / Compositeurs (Writers)</label><input type="text" id="t-writers-${i}" class="form-control" value="${t.writers || ''}"></div>
                        <div class="form-group full-width"><label>Paroles</label><textarea id="t-lyrics-${i}" class="form-control" rows="2">${t.lyricsText || ''}</textarea></div>
                        
                        <div class="form-group full-width" style="background:#ffffff; padding:12px; border-radius:8px;">
                            <label style="color:#059669; font-weight:bold;">Fichier Audio Stereo (WAV / MP3)</label>
                            <input type="file" id="file-audio-${i}" accept="audio/*" class="form-control">
                        </div>
                        <div class="form-group full-width" style="background:#ffffff; padding:12px; border-radius:8px;">
                            <label style="color:#2563eb; font-weight:bold;">Fichier Audio Dolby Atmos (Optionnel)</label>
                            <input type="file" id="file-atmos-${i}" accept="audio/*,.caf" class="form-control">
                        </div>
                    </div>
                `;
                container.appendChild(box);
            });
        }

        window.supprimerPiste = function (index) {
            capturerSaisiesPistes();
            pistesActuelles.splice(index, 1);
            afficherPistesHTML();
        };

        window.ajouterPiste = function () {
            capturerSaisiesPistes();
            pistesActuelles.push({ title: "", version: "", isrc: "", writers: "", lyricsText: "" });
            afficherPistesHTML();
        };

        // Envoi par paquets de 5 Mo directement vers l'API Worker
        async function envoyerFichierParChunks(file, type = "track", onProgress = null) {
            const CHUNK_SIZE = 5 * 1024 * 1024; // 5 Mo
            const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
            const uploadId = `upload_${Date.now()}_${Math.random().toString(36).substring(2, 7)}`;
            const baseUrl = getApiBaseUrl();

            const headers = {};
            if (auth.currentUser) {
                const token = await auth.currentUser.getIdToken();
                headers["Authorization"] = `Bearer ${token}`;
            }

            // 1. Si le fichier fait <= 5 Mo, envoi direct
            if (file.size <= CHUNK_SIZE) {
                const formData = new FormData();
                formData.append("file", file);

                const res = await fetch(`${baseUrl}/api/upload/${type}`, {
                    method: "POST",
                    headers: headers,
                    body: formData
                });

                const result = await res.json();
                if (!res.ok || !result.success) {
                    throw new Error(result.error || `Erreur d'envoi du fichier (HTTP ${res.status})`);
                }
                return result.url || `/api/files/${encodeURIComponent(result.key)}`;
            }

            // 2. Découpe et envoi séquentiel des paquets de 5 Mo
            for (let i = 0; i < totalChunks; i++) {
                const start = i * CHUNK_SIZE;
                const end = Math.min(file.size, start + CHUNK_SIZE);
                const chunkBlob = file.slice(start, end);

                const formData = new FormData();
                formData.append("file", chunkBlob, `${file.name}.part${i}`);
                formData.append("chunkIndex", i);
                formData.append("totalChunks", totalChunks);
                formData.append("uploadId", uploadId);
                formData.append("type", type);
                formData.append("originalFileName", file.name);

                const chunkRes = await fetch(`${baseUrl}/api/upload/chunk`, {
                    method: "POST",
                    headers: headers,
                    body: formData
                });

                if (!chunkRes.ok) {
                    const errJson = await chunkRes.json().catch(() => ({}));
                    throw new Error(errJson.error || `Erreur lors de l'envoi du morceau ${i + 1}/${totalChunks} (HTTP ${chunkRes.status})`);
                }

                if (typeof onProgress === "function") {
                    const percent = Math.round(((i + 1) / totalChunks) * 100);
                    onProgress(percent);
                }
            }

            // 3. Finalisation et assemblage sur R2
            const completeFormData = new FormData();
            completeFormData.append("uploadId", uploadId);
            completeFormData.append("type", type);
            completeFormData.append("originalFileName", file.name);

            const completeRes = await fetch(`${baseUrl}/api/upload/chunk/complete`, {
                method: "POST",
                headers: headers,
                body: completeFormData
            });

            const resultJson = await completeRes.json();
            if (!completeRes.ok || !resultJson.success) {
                throw new Error(resultJson.error || "Échec de l'assemblage du fichier sur le serveur.");
            }

            return resultJson.url || `/api/files/${encodeURIComponent(resultJson.key)}`;
        }

        window.creerEtUploaderSortie = async function () {
            const userId = document.getElementById("select-user").value;
            const artistName = document.getElementById("select-artist").value;
            const title = document.getElementById("edit-title").value.trim();

            if (!userId) { alert("Veuillez sélectionner un compte utilisateur."); return; }
            if (!artistName) { alert("Veuillez sélectionner un artiste."); return; }
            if (!title) { alert("Veuillez indiquer au moins le titre de la sortie."); return; }

            const coverFile = document.getElementById("file-cover").files[0];
            if (!coverFile) { alert("Veuillez importer un fichier de pochette."); return; }

            capturerSaisiesPistes();

            for (let i = 0; i < pistesActuelles.length; i++) {
                const fAudio = document.getElementById(`file-audio-${i}`).files[0];
                if (!fAudio) {
                    alert(`Veuillez importer un fichier audio pour la piste ${i + 1}.`);
                    return;
                }
            }

            const btn = document.getElementById("btn-submit");
            const progressContainer = document.getElementById("progress-container");
            const progressBar = document.getElementById("progress-bar");

            btn.disabled = true;
            btn.style.opacity = "0.5";
            progressContainer.style.display = "block";

            try {
                // 1. Upload de la pochette
                progressBar.style.width = "10%";
                progressBar.textContent = "Upload Pochette...";
                const coverUrl = await envoyerFichierParChunks(coverFile, "cover");

                // 2. Upload des fichiers audio par paquets de 5 Mo
                const totalTracks = pistesActuelles.length;
                for (let i = 0; i < totalTracks; i++) {
                    const audioFile = document.getElementById(`file-audio-${i}`).files[0];

                    pistesActuelles[i].fileUrl = await envoyerFichierParChunks(audioFile, "track", (pct) => {
                        progressBar.style.width = `${pct}%`;
                        progressBar.textContent = `Piste ${i + 1}/${totalTracks} (${pct}%)...`;
                    });
                    pistesActuelles[i].audioUrl = pistesActuelles[i].fileUrl;

                    const atmosFile = document.getElementById(`file-atmos-${i}`).files[0];
                    if (atmosFile) {
                        pistesActuelles[i].atmosUrl = await envoyerFichierParChunks(atmosFile, "atmos", (pct) => {
                            progressBar.style.width = `${pct}%`;
                            progressBar.textContent = `Atmos ${i + 1}/${totalTracks} (${pct}%)...`;
                        });
                        pistesActuelles[i].atmosAudioUrl = pistesActuelles[i].atmosUrl;
                    }
                }

                // 3. Enregistrement des métadonnées dans Cloudflare D1
                progressBar.style.width = "95%";
                progressBar.textContent = "Enregistrement D1...";

                const releaseData = {
                    title: title,
                    versionLine: document.getElementById("edit-versionLine").value,
                    artistName: artistName,
                    type: document.getElementById("edit-type").value,
                    format: document.getElementById("edit-format").value,
                    status: document.getElementById("edit-status").value,
                    upc: document.getElementById("edit-upc").value,
                    catalogNumber: document.getElementById("edit-catalogNumber").value,
                    labelName: document.getElementById("edit-label").value,
                    primaryGenre: document.getElementById("edit-primaryGenre").value,
                    secondaryGenre: document.getElementById("edit-secondaryGenre").value,
                    language: document.getElementById("edit-language").value,
                    releaseDate: document.getElementById("edit-releaseDate").value,
                    coverUrl: coverUrl,
                    tracks: pistesActuelles,
                    showOnMmcpCatalog: true,
                    manualPlatforms: false,
                    selectedPlatforms: [],
                    additionalDeliveries: []
                };

                const res = await api.post(`/api/users/${userId}/releases`, releaseData);

                progressBar.style.width = "100%";
                progressBar.textContent = "Transfert terminé !";

                const newReleaseId = res.id || res.releaseId || "";
                alert(`Sortie "${title}" créée et téléversée par morceaux avec succès dans D1 !`);
                window.location.href = `sortie.html?id=${newReleaseId}`;

            } catch (err) {
                console.error("Erreur de transfert :", err);
                alert("Erreur lors du transfert : " + err.message);
                btn.disabled = false;
                btn.style.opacity = "1";
                progressContainer.style.display = "none";
            }
        };
    </script>
</body>

</html>

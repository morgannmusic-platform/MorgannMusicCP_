<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Administrateur | MMCP</title>
    <link rel="stylesheet" href="admin.css">
    <style>
        .page-title {
            margin-top: 40px;
            margin-bottom: 24px;
            font-size: 24px;
            font-weight: 700;
            color: #000000;
        }

        .ai-grid-table {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .ai-card-cell {
            background-color: rgba(232, 232, 232, 0.349);
            backdrop-filter: blur(62px);
            -webkit-backdrop-filter: blur(62px);
            border: 1px solid rgba(189, 189, 189, 0.438);
            border-radius: 34px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.268);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .ai-card-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 16px;
            color: #000000;
        }

        .badge {
            background: #FC8FB0;
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .ai-summary-box {
            font-size: 14px;
            color: #334155;
            line-height: 1.6;
        }

        .stat-highlight {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: #000000;
        }

        .stat-subtext {
            margin: 0;
            color: #64748b;
            font-size: 13px;
        }

        .text-danger {
            color: #dc2626 !important;
            font-weight: bold;
        }

        .loader {
            color: #64748b;
            font-style: italic;
        }
    </style>
</head>

<body>

    <div class="admin-wrapper">
        <!-- Sidebar fixe à gauche -->
        <aside id="sidebar-injector" class="sidebar-container"></aside>

        <!-- Contenu principal à droite -->
        <main class="main-container">

            <header id="navbar-injector" class="navbar-container"></header>

            <h2 class="page-title">Tableau de bord Administrateur & Actions Requises</h2>

            <div class="ai-grid-table">

                <!-- Carte 1 : Comptes utilisateurs -->
                <div class="ai-card-cell">
                    <div class="ai-card-title">
                        <span>Vérification Comptes</span>
                        <span class="badge">Sécurité</span>
                    </div>
                    <div id="comptes-box" class="ai-summary-box">
                        <span class="loader">Chargement des comptes...</span>
                    </div>
                </div>

                <!-- Carte 2 : Sorties globales de la plateforme -->
                <div class="ai-card-cell">
                    <div class="ai-card-title">
                        <span>Sorties à Vérifier</span>
                        <span class="badge">Distribution</span>
                    </div>
                    <div id="sorties-box" class="ai-summary-box">
                        <span class="loader">Comptage des sorties MMCP...</span>
                    </div>
                </div>

                <!-- Carte 3 : Support & Tickets -->
                <div class="ai-card-cell">
                    <div class="ai-card-title">
                        <span>Urgences Support</span>
                        <span class="badge">Tickets</span>
                    </div>
                    <div id="support-box" class="ai-summary-box">
                        <span class="loader">Lecture des tickets...</span>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script type="module">
        import { auth } from "/assets/js/firebase.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
        import { api } from "/assets/js/api.js";
        import { initSidebar } from "./sidebar.js";
        import { chargerProfilNavbar } from "./navbar.js";

        async function injecterComposants() {
            try {
                const resSidebar = await fetch('sidebar.html');
                if (resSidebar.ok) {
                    document.getElementById('sidebar-injector').innerHTML = await resSidebar.text();
                    initSidebar(auth);
                }

                const resNavbar = await fetch('navbar.html');
                if (resNavbar.ok) {
                    document.getElementById('navbar-injector').innerHTML = await resNavbar.text();
                    if (auth.currentUser) chargerProfilNavbar(null, auth.currentUser);
                }
            } catch (e) {
                console.error("Erreur injection composants : ", e);
            }
        }

        // CHARGEMENT DES MÉTRIQUES ADMIN DEPUIS D1 / D3
        async function chargerMetriquesAdmin() {
            const sortiesBox = document.getElementById("sorties-box");
            const comptesBox = document.getElementById("comptes-box");
            const supportBox = document.getElementById("support-box");

            // 1. Métriques des Sorties (Releases)
            try {
                let releasesList;
                try {
                    releasesList = await api.get("/api/admin/releases");
                } catch (e) {
                    releasesList = await api.get("/api/releases");
                }

                const rawReleases = Array.isArray(releasesList) ? releasesList : (releasesList.releases || releasesList.data || []);
                let countMmcp = 0, countPlat = 0, totalReleases = rawReleases.length;

                rawReleases.forEach(rel => {
                    const status = String(rel.status || "").toLowerCase().trim();
                    if (status.includes("verification") || status.includes("mmcp") || status === "brouillon") countMmcp++;
                    else if (status.includes("plateforme") || status.includes("livr")) countPlat++;
                });

                sortiesBox.innerHTML = `
                    <p class="stat-highlight">⚠️ <strong class="${countMmcp > 0 ? 'text-danger' : ''}">${countMmcp}</strong> sortie(s) à vérifier</p>
                    <p class="stat-subtext">• ${countPlat} en cours/livrée(s)<br>• ${totalReleases} sortie(s) au total</p>
                `;
            } catch (err) {
                console.error("Erreur métriques sorties:", err);
                sortiesBox.innerHTML = `<span class="text-danger">Erreur de lecture des sorties D1</span>`;
            }

            // 2. Métriques des Comptes Utilisateurs (Users D1/D3)
            try {
                let usersRes;
                try {
                    usersRes = await api.get("/api/admin/users");
                } catch (e) {
                    usersRes = await api.get("/api/users");
                }

                const rawUsers = Array.isArray(usersRes) ? usersRes : (usersRes.users || usersRes.data || []);
                let totalUsers = rawUsers.length, countLabelPlan = 0;

                rawUsers.forEach(usr => {
                    const plan = String(usr.planName || usr.plan || "").toLowerCase();
                    if (plan.includes("label") || plan.includes("pro")) countLabelPlan++;
                });

                comptesBox.innerHTML = `
                    <p class="stat-highlight">👤 <strong>${totalUsers}</strong> compte(s) enregistrés</p>
                    <p class="stat-subtext">• ${countLabelPlan} abonnement(s) Plan Label / Pro</p>
                `;
            } catch (err) {
                console.error("Erreur métriques comptes:", err);
                comptesBox.innerHTML = `<span class="text-danger">Erreur de lecture des comptes</span>`;
            }

            // 3. Messages Support & Administration
            try {
                const messagesRes = await api.get("/api/admin/messages");
                const rawMessages = Array.isArray(messagesRes) ? messagesRes : (messagesRes.messages || messagesRes.data || []);
                const totalMessages = rawMessages.length;

                supportBox.innerHTML = `
                    <p class="stat-highlight">🎟️ <strong>${totalMessages}</strong> message(s) support</p>
                    <p class="stat-subtext">Demandes récentes reçues</p>
                `;
            } catch (err) {
                supportBox.innerHTML = `<p class="stat-highlight">🎟️ <strong>0</strong> ticket urgent</p><p class="stat-subtext">Aucun problème signalé</p>`;
            }
        }

        // INITIALISATION
        injecterComposants();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                chargerMetriquesAdmin();
                chargerProfilNavbar(null, user);
            } else {
                window.location.href = "/login.html";
            }
        });
    </script>
</body>

</html>

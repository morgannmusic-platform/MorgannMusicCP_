<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Utilisateurs | MMCP Admin</title>
    <link rel="stylesheet" href="admin.css">
    <style>
        .page-header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            margin-top: 50px;
        }

        .search-bar-container {
            position: relative;
            min-width: 280px;
        }

        .search-input {
            width: 100%;
            padding: 10px 16px;
            background-color: rgba(232, 232, 232, 0.349);
            backdrop-filter: blur(62px);
            -webkit-backdrop-filter: blur(62px);
            border: 1px solid rgba(189, 189, 189, 0.438);
            border-radius: 34px;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.292);
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #FC8FB0;
        }

        .table-card {
            background-color: rgba(232, 232, 232, 0.349);
            backdrop-filter: blur(62px);
            -webkit-backdrop-filter: blur(62px);
            border: 1px solid rgba(189, 189, 189, 0.438);
            border-radius: 34px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.268);
            padding: 20px;
            overflow-x: auto;
        }

        .users-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            color: #000000;
            font-size: 14px;
        }

        .users-table th {
            padding: 14px 16px;
            border-bottom: 1px solid #334155;
            color: #545454;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .users-table td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(30, 41, 59, 0.15);
            vertical-align: middle;
        }

        .users-table tbody tr {
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .users-table tbody tr:hover {
            background: #fc8fb077 !important;
        }

        .user-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar-small {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #FC8FB0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            color: #ffffff;
            overflow: hidden;
            flex-shrink: 0;
        }

        .user-avatar-small img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .plan-tag {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            display: inline-block;
            text-transform: uppercase;
        }

        .plan-tag.free {
            background: rgba(148, 163, 184, 0.15);
            color: #64748b;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }

        .plan-tag.pro,
        .plan-tag.label {
            background: rgba(208, 17, 89, 0.15);
            color: #fc8fb0;
            border: 1px solid rgba(208, 17, 89, 0.3);
        }

        .role-badge {
            font-size: 12px;
            color: #475569;
            font-weight: 600;
        }

        .role-badge.admin {
            color: #f43f5e;
        }

        .table-loading {
            text-align: center;
            padding: 40px !important;
            color: #64748b;
        }
    </style>
</head>

<body>

    <div class="admin-wrapper">
        <!-- Sidebar fixe à gauche -->
        <aside id="sidebar-injector" class="sidebar-container"></aside>

        <!-- Contenu principal à droite -->
        <main class="main-container">

            <header id="navbar-injector" class="navbar-container"></header>

            <div class="page-header-actions">
                <div>
                    <h2 class="page-title" style="margin: 0;">Gestion des Comptes & Utilisateurs</h2>
                    <p style="color: #64748b; font-size: 14px; margin-top: 4px;">
                        Liste de tous les utilisateurs enregistrés dans la base D3/D1.
                    </p>
                </div>

                <!-- Barre de recherche rapide -->
                <div class="search-bar-container">
                    <input type="text" id="user-search-input" class="search-input"
                        placeholder="Rechercher un nom, email..." />
                </div>
            </div>

            <!-- Tableau des comptes -->
            <div class="table-card">
                <table class="users-table">
                    <thead>
                        <tr>
                            <th>Utilisateur</th>
                            <th>Email</th>
                            <th>Rôle</th>
                            <th>Abonnement / Plan</th>
                            <th>Inscrit le</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <tr>
                            <td colspan="5" class="table-loading">
                                <span>Chargement des utilisateurs depuis D3/D1...</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </main>
    </div>

    <script type="module">
        import { auth } from "/assets/js/firebase.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
        import { api } from "/assets/js/api.js";
        import { initSidebar } from "./sidebar.js";
        import { chargerProfilNavbar } from "./navbar.js";

        let listUsersCache = [];

        // Assistant pour formater les URLs d'avatar
        function obtenirAvatarUrl(rawUrl) {
            if (!rawUrl) return null;
            if (rawUrl.startsWith('http://') || rawUrl.startsWith('https://') || rawUrl.startsWith('data:')) {
                return rawUrl;
            }
            if (typeof api.fileUrl === 'function') {
                return api.fileUrl(rawUrl);
            }
            const cleanPath = rawUrl.startsWith('/') ? rawUrl : '/' + rawUrl;
            const baseUrl = api.baseUrl ? api.baseUrl.replace(/\/$/, '') : '';
            return `${baseUrl}${cleanPath}`;
        }

        // Injection des composants réutilisables
        async function injecterComposants() {
            try {
                const resSidebar = await fetch('sidebar.html');
                if (resSidebar.ok) {
                    document.getElementById('sidebar-injector').innerHTML = await resSidebar.text();
                    initSidebar(auth);

                    const links = document.querySelectorAll('.sidebar-link');
                    links.forEach(l => {
                        const href = l.getAttribute('href');
                        if (href === 'admin-comptes.html' || href === 'comptes.html') {
                            l.classList.add('active');
                        } else {
                            l.classList.remove('active');
                        }
                    });
                }

                const resNavbar = await fetch('navbar.html');
                if (resNavbar.ok) {
                    document.getElementById('navbar-injector').innerHTML = await resNavbar.text();
                    if (auth.currentUser) chargerProfilNavbar(null, auth.currentUser);
                }
            } catch (e) {
                console.error("Erreur injection composants : ", e);
            }
        }

        // Chargement des comptes depuis la base D3 / D1 via l'API Worker
        async function chargerComptes() {
            const tbody = document.getElementById("users-table-body");

            try {
                let usersRes;
                try {
                    usersRes = await api.get("/api/admin/users");
                } catch (e) {
                    usersRes = await api.get("/api/users");
                }

                const rawData = Array.isArray(usersRes)
                    ? usersRes
                    : (usersRes.users || usersRes.data || usersRes.results || []);

                listUsersCache = Array.isArray(rawData) ? rawData : [];
                afficherTableauComptes(listUsersCache);
            } catch (err) {
                console.error("Erreur récupération des comptes D3/D1 :", err);
                tbody.innerHTML = `<tr><td colspan="5" class="table-loading" style="color:#ef4444;">Erreur lors du chargement des comptes depuis la base de données.</td></tr>`;
            }
        }

        // Rendu HTML du tableau des comptes
        function afficherTableauComptes(liste) {
            const tbody = document.getElementById("users-table-body");
            if (!liste || liste.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="table-loading">Aucun utilisateur trouvé.</td></tr>`;
                return;
            }

            tbody.innerHTML = liste.map(user => {
                const photoUrl = obtenirAvatarUrl(user.photoURL || user.photo || user.avatarUrl);
                const firstName = user.firstName || user.prenom || "";
                const lastName = user.lastName || user.nom || "";
                const fullName = `${firstName} ${lastName}`.trim() || user.displayName || user.name || "Utilisateur";
                const email = user.email || "—";
                const role = user.role || "Utilisateur";
                const plan = user.planName || user.plan || "Gratuit";

                // Formater la date d'inscription
                let createdAt = "—";
                const rawDate = user.createdAt || user.created_at || user.dateInscription;
                if (rawDate) {
                    const d = new Date(rawDate);
                    if (!isNaN(d.getTime())) {
                        createdAt = d.toLocaleDateString('fr-FR');
                    }
                }

                const initials = fullName.charAt(0).toUpperCase() || "U";
                const avatarHTML = photoUrl
                    ? `<img src="${photoUrl}" alt="${fullName}" onerror="this.onerror=null; this.parentNode.innerHTML='<span>${initials}</span>';">`
                    : `<span>${initials}</span>`;

                const isPro = plan.toLowerCase().includes("pro") || plan.toLowerCase().includes("label");
                const planClass = isPro ? "pro" : "free";
                const userId = user.id || user.uid || "";

                return `
            <tr class="user-row" data-id="${userId}">
                <td>
                    <div class="user-cell">
                        <div class="user-avatar-small">${avatarHTML}</div>
                        <strong>${fullName}</strong>
                    </div>
                </td>
                <td>${email}</td>
                <td><span class="role-badge ${String(role).toLowerCase().includes('admin') ? 'admin' : ''}">${role}</span></td>
                <td><span class="plan-tag ${planClass}">${plan}</span></td>
                <td style="color: #64748b;">${createdAt}</td>
            </tr>
        `;
            }).join("");

            // Redirection au clic sur une ligne vers l'édition du compte
            document.querySelectorAll('.user-row').forEach(row => {
                row.addEventListener('click', () => {
                    const userId = row.getAttribute('data-id');
                    if (userId) {
                        window.location.href = `compte.html?id=${userId}`;
                    }
                });
            });
        }

        // Filtre de recherche dynamique
        document.getElementById("user-search-input").addEventListener("input", (e) => {
            const searchVal = e.target.value.toLowerCase().trim();
            const filtered = listUsersCache.filter(u => {
                const name = `${u.firstName || ''} ${u.lastName || ''} ${u.displayName || ''} ${u.name || ''}`.toLowerCase();
                const email = (u.email || '').toLowerCase();
                return name.includes(searchVal) || email.includes(searchVal);
            });
            afficherTableauComptes(filtered);
        });

        // Initialisation
        injecterComposants();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                chargerProfilNavbar(null, user);
                chargerComptes();
            } else {
                window.location.href = "/login.html";
            }
        });
    </script>
</body>

</html>

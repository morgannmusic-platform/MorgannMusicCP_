<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Retraits (Admin) - MM-CP</title>
    <link rel="stylesheet" href="admin.css">
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .admin-card {
            background-color: rgba(232, 232, 232, 0.349);
            backdrop-filter: blur(62px);
            -webkit-backdrop-filter: blur(62px);
            border: 1px solid rgba(189, 189, 189, 0.438);
            border-radius: 34px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.268);
            padding: 24px;
            margin: 50px 0 20px 0;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #000000;
            border-bottom: 1px solid #000000;
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
        }

        th,
        td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #FC8FB0;
            color: #000000;
        }

        th {
            background: #FC8FB0;
            color: #ffffff;
            border-radius: 30px 30px 0 0;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
        }

        tr:hover {
            background: #fc8fb070;
        }

        select {
            background: #FC8FB0;
            border: 1px solid #ffffff;
            color: #ffffff;
            padding: 6px 10px;
            border-radius: 50px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        select option {
            background: #ffffff;
            color: #000000;
        }

        select:focus {
            border-color: #FC8FB0;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-demande {
            background: rgba(255, 193, 7, 0.15);
            color: #b7791f;
            border: 1px solid rgba(255, 193, 7, 0.3);
        }

        .badge-envoye {
            background: rgba(34, 197, 94, 0.15);
            color: #15803d;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .badge-refuse {
            background: rgba(239, 68, 68, 0.15);
            color: #b91c1c;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
    </style>
</head>

<body>

    <div class="admin-wrapper">
        <!-- Sidebar fixe à gauche -->
        <aside id="sidebar-injector" class="sidebar-container"></aside>

        <!-- Contenu principal à droite -->
        <main class="main-container">

            <header id="navbar-injector" class="navbar-container"></header>

            <div class="admin-card">
                <div class="card-title">Gestion des demandes de retrait</div>
                <table>
                    <thead>
                        <tr>
                            <th>Utilisateur</th>
                            <th>Montant</th>
                            <th>IBAN</th>
                            <th>Statut actuel</th>
                            <th>Changer le statut</th>
                        </tr>
                    </thead>
                    <tbody id="withdrawals-body">
                        <tr>
                            <td colspan="5" style="text-align:center; color:#94a3b8;">Chargement des demandes...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </main>
    </div>

    <script type="module">
        import { auth } from "/assets/js/firebase.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
        import { api } from "/assets/js/api.js";

        import { initSidebar } from "./sidebar.js";
        // Si vous utilisez une fonction de profil navbar partagée, assurez-vous du bon chemin ou import
        import { chargerProfilNavbar } from "./navbar.js";

        async function injecterComposants() {
            try {
                const resSidebar = await fetch('sidebar.html');
                if (resSidebar.ok) {
                    document.getElementById('sidebar-injector').innerHTML = await resSidebar.text();
                    initSidebar(auth);

                    const links = document.querySelectorAll('.sidebar-link');
                    links.forEach(l => {
                        if (l.getAttribute('href') === 'retraits_3.html' || l.getAttribute('href') === 'retraits.html') {
                            l.classList.add('active');
                        } else {
                            l.classList.remove('active');
                        }
                    });
                }

                const resNavbar = await fetch('navbar.html');
                if (resNavbar.ok) {
                    document.getElementById('navbar-injector').innerHTML = await resNavbar.text();
                }
            } catch (e) {
                console.error("Erreur injection composants : ", e);
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                chargerDemandes();
            } else {
                window.location.href = "login.html";
            }
        });

        async function chargerDemandes() {
            const tbody = document.getElementById("withdrawals-body");
            tbody.innerHTML = "";

            try {
                const withdrawals = await api.get(`/api/admin/withdrawals`);

                if (!Array.isArray(withdrawals) || withdrawals.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#94a3b8;">Aucune demande de retrait enregistrée.</td></tr>`;
                    return;
                }

                withdrawals.forEach((w) => {
                    const id = w.id;
                    const tr = document.createElement("tr");

                    let badgeClass = "badge-demande";
                    if (w.status === "envoyé") badgeClass = "badge-envoye";
                    if (w.status === "refusé") badgeClass = "badge-refuse";

                    const userIdentifier = w.userEmail || w.user_uid || w.userId || "Utilisateur";
                    const amountVal = Number(w.amount || 0).toFixed(2);
                    const ibanVal = w.iban || "-";
                    const currentStatus = w.status || "demandé";

                    tr.innerHTML = `
                        <td>${userIdentifier}</td>
                        <td><strong>${amountVal} €</strong></td>
                        <td style="font-family: monospace;">${ibanVal}</td>
                        <td><span class="badge ${badgeClass}">${currentStatus}</span></td>
                        <td>
                            <select onchange="modifierStatut('${id}', this.value)">
                                <option value="demandé" ${currentStatus === "demandé" ? "selected" : ""}>demandé</option>
                                <option value="envoyé" ${currentStatus === "envoyé" ? "selected" : ""}>envoyé</option>
                                <option value="refusé" ${currentStatus === "refusé" ? "selected" : ""}>refusé</option>
                            </select>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="5" style="color:#ef4444; text-align:center;">Erreur : ${err.message}</td></tr>`;
            }
        }

        window.modifierStatut = async function (withdrawId, nouveauStatut) {
            try {
                await api.patch(`/api/admin/withdrawals/${withdrawId}`, {
                    status: nouveauStatut
                });

                alert("Statut mis à jour avec succès !");
                chargerDemandes();
            } catch (err) {
                alert("Erreur lors de la modification : " + err.message);
            }
        };

        injecterComposants();
    </script>
</body>

</html>

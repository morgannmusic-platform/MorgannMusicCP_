<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Label | Morgann Music CP</title>
    <link rel="stylesheet" href="js/reponsive.css">
    <script src="js/responsive.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #1e293b;
            padding: 20px;
            box-sizing: border-box;
            background-color: #f8fafc;
        }

        .main-content {
            max-width: 900px;
            margin: 4rem auto;
            text-align: center;
        }

        h1 {
            color: #3e2837;
            font-size: 32px;
            font-weight: 800;
        }

        p {
            color: #64748b;
            font-size: 18px;
        }

        .label-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid #ffffff;
            border-radius: 24px;
            padding: 30px;
            margin-top: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            text-align: left;
            display: inline-block;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        .label-card h3 {
            margin-top: 0;
            color: #3e2837;
            font-size: 22px;
        }

        .label-card p {
            margin: 8px 0;
            font-size: 16px;
        }

        .label-card a {
            color: #d01159;
            text-decoration: none;
            font-weight: 600;
        }

        .label-card a:hover {
            text-decoration: underline;
        }

        /* --- STYLE DU POP-UP DE CONFIGURATION --- */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .popup-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .popup-content {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 34px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            text-align: left;
            max-width: 480px;
            width: 90%;
            box-sizing: border-box;
            border: 1px solid rgba(189, 189, 189, 0.438);
            max-height: 90vh;
            overflow-y: auto;
        }

        .popup-content h2 {
            margin-top: 0;
            color: #3e2837;
            font-size: 24px;
            margin-bottom: 5px;
            text-align: center;
        }

        .popup-content p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #3e2837;
        }

        .popup-input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 15px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .popup-input:focus {
            border-color: #FC8FB0;
        }

        .color-group {
            display: flex;
            gap: 15px;
        }

        .color-group .form-group {
            flex: 1;
        }

        .popup-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 25px;
        }

        .btn-popup {
            display: inline-block;
            background-color: #FC8FB0;
            color: #ffffff;
            border: none;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-popup:hover {
            background-color: #d01159;
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #475569;
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        .choice-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .choice-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #cbd5e1;
            background: #fff;
            border-radius: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .choice-btn.selected {
            border-color: #FC8FB0;
            background: rgba(252, 143, 176, 0.1);
            color: #d01159;
        }

        .file-preview {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }
    </style>
</head>

<body>

    <div id="navbar-container"></div>
    <script type="module" src="js/navbar.js"></script>
    <div id="sidebar-container"></div>
    <script src="/portail/label/js/sidebar.js"></script>

    <div class="main-content">
        <h1>Portail Label</h1>
        <p>Gérez et configurez les informations officielles de votre label musical.</p>

        <!-- Affichage des infos du label si existant -->
        <div id="label-info-container" style="display: none;">
            <div class="label-card">
                <h3 id="display-label-name">Chargement...</h3>
                <p><strong>Site web :</strong> <a id="display-label-url" href="#" target="_blank">Aucun site</a></p>
                <div id="display-branding" style="margin-top: 15px; display: flex; gap: 15px; align-items: center;">
                </div>
                <div style="margin-top: 20px; text-align: right;">
                    <button type="button" id="open-edit-popup" class="btn-popup"
                        style="padding: 8px 16px; font-size: 14px;">Modifier les informations</button>
                </div>
            </div>
        </div>
    </div>

    <!-- POP-UP CONFIGURATION & MODIFICATION LABEL -->
    <div id="label-popup-overlay" class="popup-overlay">
        <div class="popup-content">

            <!-- ÉTAPE 1 : Informations Générales & Web -->
            <div id="step-1" class="popup-step">
                <h2>Votre Label</h2>
                <p>Configurez l'identité de base de votre label.</p>

                <div class="form-group">
                    <label>Nom du label *</label>
                    <input type="text" id="label-name-input" class="popup-input" placeholder="Ex: Mon Super Label">
                </div>

                <div class="form-group">
                    <label>Avez-vous un site internet ?</label>
                    <div class="choice-group">
                        <button type="button" class="choice-btn" id="has-site-no">Non</button>
                        <button type="button" class="choice-btn selected" id="has-site-yes">Oui</button>
                    </div>
                </div>

                <div class="form-group" id="url-container">
                    <label>URL du site web</label>
                    <input type="url" id="label-url-input" class="popup-input" placeholder="https://www.monlabel.com">
                </div>

                <div class="popup-actions">
                    <button type="button" id="cancel-popup" class="btn-popup btn-secondary"
                        style="display: none;">Annuler</button>
                    <button type="button" id="next-to-step-2" class="btn-popup">Suivant</button>
                </div>
            </div>

            <!-- ÉTAPE 2 : Couleurs et Visuels -->
            <div id="step-2" class="popup-step" style="display: none;">
                <h2>Design & Branding</h2>
                <p>Personnalisez les couleurs et les graphismes.</p>

                <div class="color-group">
                    <div class="form-group">
                        <label>Couleur d'accentuation</label>
                        <input type="color" id="label-accent-color" class="popup-input" value="#FC8FB0"
                            style="height: 42px; padding: 2px; cursor: pointer;">
                    </div>
                    <div class="form-group">
                        <label>Couleur du fond</label>
                        <input type="color" id="label-bg-color" class="popup-input" value="#ffffff"
                            style="height: 42px; padding: 2px; cursor: pointer;">
                    </div>
                </div>

                <div class="form-group">
                    <label>Logo (PNG / SVG avec fond transparent requis)</label>
                    <input type="file" id="label-logo-file" class="popup-input" accept=".png,.svg">
                    <div id="current-logo-preview" class="file-preview"></div>
                </div>

                <div class="form-group">
                    <label>Apple Touch Icon</label>
                    <input type="file" id="label-icon-file" class="popup-input" accept="image/*">
                    <div id="current-icon-preview" class="file-preview"></div>
                </div>

                <div class="form-group">
                    <label>Favicon (.ico ou image)</label>
                    <input type="file" id="label-favicon-file" class="popup-input" accept=".ico,.png,.jpg">
                    <div id="current-favicon-preview" class="file-preview"></div>
                </div>

                <div class="popup-actions">
                    <button type="button" id="back-to-step-1" class="btn-popup btn-secondary">Retour</button>
                    <button type="button" id="submit-label" class="btn-popup">Enregistrer</button>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        import { auth } from "/assets/js/firebase.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
        import { api } from "/assets/js/api.js";

        let labelData = {
            id: null,
            nom: "",
            hasSite: true,
            url: "",
            accentColor: "#FC8FB0",
            bgColor: "#ffffff",
            iconUrl: "",
            faviconUrl: "",
            logoUrl: ""
        };

        const step1 = document.getElementById("step-1");
        const step2 = document.getElementById("step-2");
        const nameInput = document.getElementById("label-name-input");
        const urlInput = document.getElementById("label-url-input");
        const accentInput = document.getElementById("label-accent-color");
        const bgInput = document.getElementById("label-bg-color");

        const logoFile = document.getElementById("label-logo-file");
        const iconFile = document.getElementById("label-icon-file");
        const faviconFile = document.getElementById("label-favicon-file");

        const currentLogoPreview = document.getElementById("current-logo-preview");
        const currentIconPreview = document.getElementById("current-icon-preview");
        const currentFaviconPreview = document.getElementById("current-favicon-preview");

        const btnNext = document.getElementById("next-to-step-2");
        const btnBack = document.getElementById("back-to-step-1");
        const btnSubmit = document.getElementById("submit-label");
        const btnCancel = document.getElementById("cancel-popup");
        const btnOpenEdit = document.getElementById("open-edit-popup");

        const btnYes = document.getElementById("has-site-yes");
        const btnNo = document.getElementById("has-site-no");
        const urlContainer = document.getElementById("url-container");

        const popupOverlay = document.getElementById("label-popup-overlay");
        const labelInfoContainer = document.getElementById("label-info-container");
        const displayLabelName = document.getElementById("display-label-name");
        const displayLabelUrl = document.getElementById("display-label-url");
        const displayBranding = document.getElementById("display-branding");

        btnYes.addEventListener("click", () => {
            btnYes.classList.add("selected");
            btnNo.classList.remove("selected");
            labelData.hasSite = true;
            urlContainer.style.display = "block";
        });

        btnNo.addEventListener("click", () => {
            btnNo.classList.add("selected");
            btnYes.classList.remove("selected");
            labelData.hasSite = false;
            urlContainer.style.display = "none";
            urlInput.value = "";
        });

        btnNext.addEventListener("click", () => {
            const val = nameInput.value.trim();
            if (!val) {
                alert("Veuillez entrer le nom de votre label.");
                return;
            }
            labelData.nom = val;
            step1.style.display = "none";
            step2.style.display = "block";
        });

        btnBack.addEventListener("click", () => {
            step2.style.display = "none";
            step1.style.display = "block";
        });

        btnCancel.addEventListener("click", () => {
            popupOverlay.classList.remove("show");
        });

        btnOpenEdit.addEventListener("click", () => {
            nameInput.value = labelData.nom || "";
            if (labelData.url) {
                btnYes.click();
                urlInput.value = labelData.url;
            } else {
                btnNo.click();
            }
            accentInput.value = labelData.accentColor || "#FC8FB0";
            bgInput.value = labelData.bgColor || "#ffffff";

            currentLogoPreview.innerText = labelData.logoUrl ? "Actuel : Fichier enregistré" : "Aucun fichier";
            currentIconPreview.innerText = labelData.iconUrl ? "Actuel : Fichier enregistré" : "Aucun fichier";
            currentFaviconPreview.innerText = labelData.faviconUrl ? "Actuel : Fichier enregistré" : "Aucun fichier";

            step1.style.display = "block";
            step2.style.display = "none";
            btnCancel.style.display = "inline-block";
            popupOverlay.classList.add("show");
        });

        async function uploadFile(file) {
            const formData = new FormData();
            formData.append("file", file);
            const res = await api.post("/api/upload", formData);
            return res.url || res.key || "";
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "/login.html";
                return;
            }

            try {
                const response = await api.get(`/api/users/${user.uid}/labels`);
                let existingLabel = null;
                if (Array.isArray(response) && response.length > 0) {
                    existingLabel = response[0];
                } else if (response && response.nom) {
                    existingLabel = response;
                }

                if (existingLabel && existingLabel.nom) {
                    labelData.id = existingLabel.id;
                    labelData.nom = existingLabel.nom;
                    labelData.url = existingLabel.url || "";
                    labelData.accentColor = existingLabel.accent_color || "#FC8FB0";
                    labelData.bgColor = existingLabel.bg_color || "#ffffff";
                    labelData.iconUrl = existingLabel.icon_url || "";
                    labelData.faviconUrl = existingLabel.favicon_url || "";
                    labelData.logoUrl = existingLabel.logo_url || "";

                    displayLabelName.innerText = existingLabel.nom;
                    if (existingLabel.url) {
                        displayLabelUrl.href = existingLabel.url;
                        displayLabelUrl.innerText = existingLabel.url;
                        displayLabelUrl.parentElement.style.display = "block";
                    } else {
                        displayLabelUrl.parentElement.style.display = "none";
                    }
                    let logoDisplayUrl = "";
                    if (existingLabel.logo_url) {
                        if (existingLabel.logo_url.startsWith('http')) {
                            logoDisplayUrl = existingLabel.logo_url;
                        } else {
                            const cleanPath = existingLabel.logo_url.replace(/^\/?api\/files\//, '').replace(/^\/+/, '');
                            logoDisplayUrl = `https://api.worker.mm-cp.uk/api/files/${cleanPath}`;
                        }
                    }
                    displayBranding.innerHTML = `
                        ${logoDisplayUrl ? `<img src="${logoDisplayUrl}" alt="Logo" style="height: 40px; object-fit: contain;">` : '<span style="font-size:13px; color:#888;">Pas de logo</span>'}
                        <div style="display:flex; align-items:center; gap:5px; font-size:13px;">
                            Accent : <span style="display:inline-block; width: 20px; height: 20px; border-radius: 50%; background: ${existingLabel.accent_color || '#FC8FB0'}; border: 1px solid #ccc;"></span>
                        </div>
                        <div style="display:flex; align-items:center; gap:5px; font-size:13px;">
                            Fond : <span style="display:inline-block; width: 20px; height: 20px; border-radius: 50%; background: ${existingLabel.bg_color || '#ffffff'}; border: 1px solid #ccc;"></span>
                        </div>
                    `;
                    labelInfoContainer.style.display = "block";
                    popupOverlay.classList.remove("show");
                } else {
                    btnCancel.style.display = "none";
                    popupOverlay.classList.add("show");
                }
            } catch (err) {
                console.error("Erreur récupération label:", err);
                btnCancel.style.display = "none";
                popupOverlay.classList.add("show");
            }

            btnSubmit.addEventListener("click", async () => {
                if (labelData.hasSite && !urlInput.value.trim()) {
                    alert("Veuillez entrer l'URL de votre site web.");
                    return;
                }
                labelData.url = labelData.hasSite ? urlInput.value.trim() : "";
                labelData.accentColor = accentInput.value;
                labelData.bgColor = bgInput.value;

                try {
                    if (logoFile.files[0]) {
                        labelData.logoUrl = await uploadFile(logoFile.files[0]);
                    }
                    if (iconFile.files[0]) {
                        labelData.iconUrl = await uploadFile(iconFile.files[0]);
                    }
                    if (faviconFile.files[0]) {
                        labelData.faviconUrl = await uploadFile(faviconFile.files[0]);
                    }

                    const response = await api.post(`/api/users/${user.uid}/labels`, {
                        id: labelData.id,
                        nom: labelData.nom,
                        url: labelData.url,
                        accentColor: labelData.accentColor,
                        bgColor: labelData.bgColor,
                        iconUrl: labelData.iconUrl,
                        faviconUrl: labelData.faviconUrl,
                        logoUrl: labelData.logoUrl
                    });

                    if (response && response.success) {
                        popupOverlay.classList.remove("show");
                        alert("Informations du label enregistrées avec succès !");
                        window.location.reload();
                    } else {
                        alert("Erreur lors de l'enregistrement.");
                    }
                } catch (err) {
                    console.error("Erreur API label:", err);
                    alert("Une erreur est survenue.");
                }
            });
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Première - Morgann Music CP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            color: #333;
            margin: 0;
            padding: 20px;
            background: #E8FDC4;
        }

        .container {
            max-width: 1000px;
            margin: 60px auto;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(62px);
            -webkit-backdrop-filter: blur(62px);
            border: 1px solid rgba(189, 189, 189, 0.438);
            border-radius: 40px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 40px;
            margin-bottom: 30px;
        }

        .release-header {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            align-items: center;
        }

        .cover-container {
            width: 280px;
            height: 280px;
            border-radius: 29px;
            overflow: hidden;
            background: #eee;
            position: relative;
        }

        .cover-container img,
        .cover-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-animated-cover {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 4px 10px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 12px;
            text-transform: uppercase;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }

        .release-info {
            flex: 1;
            min-width: 280px;
        }

        .release-info h1 {
            font-size: 32px;
            margin: 0 0 10px 0;
            font-weight: bold;
        }

        .artist-name {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .badge-premiere {
            display: inline-block;
            background: #FC8FB0;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .tracks-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .track-item {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(189, 189, 189, 0.4);
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
        }

        .track-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        audio {
            width: 100%;
            margin-top: 8px;
        }

        #password-overlay {
            display: none;
            text-align: center;
            max-width: 400px;
            margin: 100px auto;
        }

        .error-msg {
            color: #dc3545;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        :root {
            --bg-nb: rgb(252, 143, 176);
            --bg-nb-tl: rgba(252, 143, 176, 0.474);

            --text-nb: #eaffc6;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-nb: rgb(108, 122, 83);
                --bg-nb-tl: rgba(108, 122, 83, 0.338);

                --text-nb: rgb(252, 143, 176);
            }
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(180deg, var(--bg-nb), var(--bg-nb-tl));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 1;
            /* Changed from 0 to 1 to make it visible */
            gap: 15px;
            /* Added gap between logo and text */
        }

        .navbar img {
            height: 30px;
            width: auto;
        }

        .navbar h1 {
            color: var(--text-nb);
            font-size: 20px;
            margin: 0;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <img src="/assets/img/icons/premiere.png" alt="Logo Première"
            onerror="this.src='https://placehold.co/40x40/FC8FB0/ffffff?text=MM'">
        <h1>Morgann Music Première</h1>
    </nav>

    <div class="container" style="margin-top: 100px;"> <!-- Added top margin to account for fixed navbar -->
        <!-- Écran de demande de mot de passe (si sécurisé) -->
        <div id="password-overlay" class="card">
            <h2>🔒 Accès Protégé</h2>
            <p style="font-size: 14px; color: #666; margin-top: 5px;">Cette première nécessite un mot de passe pour y
                accéder.</p>
            <input type="password" id="input-password" class="pw-input" placeholder="Entrez le mot de passe...">
            <button id="btn-verify-pw" class="btn-submit">Valider</button>
            <div id="pw-error" class="error-msg">Mot de passe incorrect.</div>
        </div>

        <!-- Contenu de la Première (masqué par défaut si protégé) -->
        <div id="premiere-content" style="display: none;">
            <div class="card">
                <div class="badge-premiere">Morgann Music Première</div>
                <div class="release-header">
                    <div class="cover-container" id="cover-wrapper">
                        <!-- Inséré dynamiquement -->
                    </div>
                    <div class="release-info">
                        <h1 id="release-title">Chargement...</h1>
                        <div class="artist-name" id="release-artist">-</div>
                        <div id="release-meta" style="font-size: 13px; color: #555; line-height: 1.6;"></div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2 style="margin-top:0; font-size: 20px;">Pistes en Avant-Première</h2>
                <div class="tracks-list" id="tracks-container">
                    <!-- Inséré dynamiquement -->
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { api } from "/assets/js/api.js";

        // Récupération des paramètres d'URL (?artiste=...&slug=...) ou de l'URL propre (/premiere/nom-artiste/slug)
        const urlParams = new URLSearchParams(window.location.search);
        let artiste = urlParams.get('artiste');
        let slug = urlParams.get('slug');

        if (!slug || !artiste) {
            const pathSegments = window.location.pathname.split('/').filter(Boolean);
            // Si l'URL est de type /premiere/nom-artiste/mon-slug
            const premiereIndex = pathSegments.indexOf('premiere');
            if (premiereIndex !== -1 && pathSegments.length > premiereIndex + 2) {
                artiste = decodeURIComponent(pathSegments[premiereIndex + 1]);
                slug = pathSegments[premiereIndex + 2];
            }
        }

        async function initPremiere() {
            if (!slug || !artiste) {
                document.body.innerHTML = "<h2 style='text-align:center; margin-top:100px;'>Lien de Première invalide (Nom d'artiste ou slug manquant).</h2>";
                return;
            }

            try {
                // CORRECTION: Utilisation de l'API dédiée pour la première au lieu de fetch toute la liste
                // Cela permet aussi de vérifier directement via le endpoint sécurisé si la première est active.
                const res = await api.get(`/api/premiere?slug=${encodeURIComponent(slug)}&artiste=${encodeURIComponent(artiste)}`);

                if (res && res.error) {
                    document.body.innerHTML = `<h2 style='text-align:center; margin-top:100px;'>${res.error}</h2>`;
                    return;
                }

                const release = res;
                if (!release || !release.id) {
                    document.body.innerHTML = "<h2 style='text-align:center; margin-top:100px;'>Cette Première est introuvable, désactivée ou le nom d'artiste ne correspond pas.</h2>";
                    return;
                }

                // Gestion du mot de passe
                if (release.premierePassword && release.premierePassword.trim() !== "") {
                    document.getElementById("password-overlay").style.display = "block";

                    document.getElementById("btn-verify-pw").onclick = () => {
                        const enteredPw = document.getElementById("input-password").value;
                        if (enteredPw === release.premierePassword) {
                            document.getElementById("password-overlay").style.display = "none";
                            afficherDonneesRelease(release);
                        } else {
                            document.getElementById("pw-error").style.display = "block";
                        }
                    };
                    return;
                }

                afficherDonneesRelease(release);

            } catch (err) {
                console.error("Erreur chargement première :", err);
                // Si l'API retourne une erreur 404/403, api.js peut throw une exception.
                let msg = "Erreur de connexion. Veuillez réessayer.";
                if (err.message && err.message.includes("404")) msg = "Cette Première est introuvable.";
                if (err.message && (err.message.includes("403") || err.message.includes("401"))) msg = "Cette Première est désactivée ou le nom d'artiste ne correspond pas.";

                document.body.innerHTML = `<h2 style='text-align:center; margin-top:100px;'>${msg}</h2>`;
            }
        }

        function afficherDonneesRelease(data) {
            document.getElementById("premiere-content").style.display = "block";

            // Pochette (Animée ou Statique)
            const coverWrapper = document.getElementById("cover-wrapper");
            const animatedCoverUrl = data.animatedCoverUrl || data.animatedCover;
            if (animatedCoverUrl) {
                coverWrapper.innerHTML = `
                    <video src="${api.fileUrl(animatedCoverUrl)}" autoplay loop muted playsinline></video>
                    <div class="badge-animated-cover">Pochette animée</div>
                `;
            } else {
                const staticCover = data.coverUrl || data.cover || "/assets/img/icons/android-chrome-512x512.png";
                coverWrapper.innerHTML = `<img src="${api.fileUrl(staticCover)}" alt="Pochette">`;
            }

            // Infos principales
            document.getElementById("release-title").innerText = data.title || "Sans titre";
            document.getElementById("release-artist").innerText = `${data.artistName || 'Artiste'} • ${data.type || 'Single'}`;

            document.getElementById("release-meta").innerHTML = `
                <div><b>Date de sortie officielle :</b> ${data.releaseDate || 'Bientôt'}</div>
                <div><b>Genre :</b> ${data.primaryGenre || 'Non spécifié'}</div>
            `;

            // Pistes & Audio
            const tracksContainer = document.getElementById("tracks-container");
            tracksContainer.innerHTML = "";
            const tracks = typeof data.tracks === 'string' ? JSON.parse(data.tracks || "[]") : (data.tracks || []);

            if (tracks.length === 0) {
                tracksContainer.innerHTML = "<p style='color:#666;'>Aucune piste disponible pour le moment.</p>";
                return;
            }

            tracks.forEach((t, index) => {
                let audioSourcesHtml = '';
                const mainAudio = t.fileUrl || t.audioUrl;
                const instAudio = t.instrumentalFileUrl || t.instrumentalAudioUrl;

                if (mainAudio) {
                    audioSourcesHtml += `<div style="margin-top:10px;"><span style="font-size:12px; font-weight:bold; color:#666;">Version Stéréo</span><audio controls src="${api.fileUrl(mainAudio)}"></audio></div>`;
                }
                if (instAudio) {
                    audioSourcesHtml += `<div style="margin-top:10px;"><span style="font-size:12px; font-weight:bold; color:#666;">Version Instrumentale</span><audio controls src="${api.fileUrl(instAudio)}"></audio></div>`;
                }

                const trackEl = document.createElement("div");
                trackEl.className = "track-item";
                trackEl.innerHTML = `
                    <div class="track-title"><span style="color:#aaa; margin-right:10px;">${String(index + 1).padStart(2, '0')}</span>${t.title || 'Sans titre'}</div>
                    ${audioSourcesHtml || '<p style="font-size:13px; color:#999;">Audio non disponible</p>'}
                `;
                tracksContainer.appendChild(trackEl);
            });
        }

        initPremiere();
    </script>
</body>

</html>

name = "mon-site-api"
main = "src/index.js"
compatibility_date = "2026-08-10"

# Routes pour intercepter l'Open Graph sur les sous-domaines
routes = [
  { pattern = "link.morgannmusic.uk/sortie*", zone_name = "morgannmusic.uk" },
  { pattern = "link.morgannmusic.uk/artiste*", zone_name = "morgannmusic.uk" },
  { pattern = "play.morgannmusic.uk/sortie*", zone_name = "morgannmusic.uk" },
  { pattern = "play.morgannmusic.uk/artiste*", zone_name = "morgannmusic.uk" },
  { pattern = "mm-cp.uk/catalogue/sortie*", zone_name = "mm-cp.uk" },
  { pattern = "mm-cp.uk/catalogue/artiste*", zone_name = "mm-cp.uk" }
]

[[d1_databases]]
binding = "DB"
database_name = "ma-super-base"
database_id = "e21ef4d8-7e6a-436f-8cf4-eca72daf322f"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "morgann-music-files"

[vars]
FIREBASE_PROJECT_ID = "morgann-music-cp"
CORS_ORIGIN = "*"

[[services]]
binding = "NOTIF_SERVICE"
service = "mon-site-notifications"
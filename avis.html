<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Avis des Artistes - Catalogue MMCP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="/assets/js/navbar.js" defer></script>
    <script src="/assets/footers/accueil/footer.js" defer></script>
    <link rel="stylesheet" href="/assets/css/styles-accueil.css">
    <link rel="stylesheet" href="/assets/footers/accueil/footer.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="/assets/js/background.js"></script>
    <style>
        :root {
            --bg: #eaffc6;
            --bg-rose: #FC8FB0;
            --rose: #FC8FB0;
            --text-secondary: #c76785;
            --card-bg: #ffebf171;
            --border-subtle: rgba(252, 143, 176, 0.22);
            --container1: #f4fae1;
            --container2: #e2f2c3;
            --container3: #d7ebac;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #52303c;
                --bg-rose: #6C7A53;
                --rose: #FC8FB0;
                --text-secondary: #fbb4cb;
                --card-bg: rgba(0, 0, 0, 0.25);
                --border-subtle: rgba(252, 143, 176, 0.25);
                --container1: #6a4c57;
                --container2: #4d5942;
                --container3: #3f4a34;
            }
        }


        body {
            font-family: 'Segoe UI', sans-serif;
            color: #333;
            margin-top: 80px;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card-section {
            background: linear-gradient(140deg, var(--container1) 0%, var(--container3) 100%);
            border: 1px solid var(--border-subtle);
            border-radius: 36px;
            padding: 1.8rem 1.4rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            box-shadow: 0 16px 50px rgba(24, 53, 0, 0.248);
            transition: transform 0.3s ease;
            margin: 20px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 20px;
            color: #1e293b;
        }

        .hero-average {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            gap: 15px;
            border: 2px solid hsla(0, 0%, 100%, 0.408);
        }

        .average-score {
            font-size: 80px;
            font-weight: 900;
            color: #FC8FB0;
            line-height: 1;
            text-shadow: 0 10px 20px rgba(252, 143, 176, 0.2);
        }

        .hero-average .stars-container .star-svg {
            width: 40px;
            height: 40px;
        }

        .total-reviews-count {
            font-size: 15px;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stars-container {
            display: inline-flex;
            gap: 6px;
            align-items: center;
        }

        .star-svg {
            width: 24px;
            height: 24px;
            transition: fill 0.2s ease;
        }

        .catalog-notice {
            font-size: 13px;
            color: #475569;
            background: rgba(252, 143, 176, 0.1);
            border-left: 4px solid #FC8FB0;
            padding: 10px 15px;
            border-radius: 0 12px 12px 0;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .form-select,
        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ffd4f694;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            box-sizing: border-box;
            background: #ffffff2a;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.156);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-select:focus,
        .form-textarea:focus {
            border-color: #FC8FB0;
            box-shadow: 0 0 8px rgba(252, 143, 176, 0.3);
        }

        .form-textarea {
            resize: vertical;
            min-height: 100px;
        }

        .star-picker {
            display: flex;
            gap: 10px;
            cursor: pointer;
            padding: 5px 0;
        }

        .star-picker .star-svg {
            width: 36px;
            height: 36px;
            cursor: pointer;
        }

        .submit-btn {
            background: #FC8FB0;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .submit-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .reviews-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .review-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .review-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.04);
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .review-author-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .review-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #FC8FB0;
            background-color: #fff;
        }

        .author-details {
            display: flex;
            flex-direction: column;
        }

        .review-author-link {
            font-weight: 800;
            font-size: 16px;
            color: #1e293b;
            text-decoration: none;
            transition: color 0.2s;
        }

        .review-author-link:hover {
            color: #FC8FB0;
            text-decoration: underline;
        }

        .review-date {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .review-message {
            font-size: 14px;
            color: #334155;
            margin: 0;
            line-height: 1.6;
            white-space: pre-line;
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #f1f5f9;
        }

        .review-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: -5px;
        }

        .review-edit-btn {
            border: 1px solid #fbc0d2;
            background: #fff;
            color: #d94f7d;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .review-edit-btn:hover {
            background: #fff0f5;
            transform: translateY(-1px);
        }

        .review-owner-badge {
            display: inline-flex;
            align-items: center;
            width: fit-content;
            margin-top: 5px;
            padding: 3px 8px;
            border-radius: 999px;
            background: rgba(252, 143, 176, 0.12);
            color: #d94f7d;
            font-size: 10px;
            font-weight: 800;
        }

        .artist-selected-preview {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #ffd4f694;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            box-sizing: border-box;
            background: #ffffff2a;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.156);
            border-radius: 20px;
        }

        .artist-selected-preview img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #FC8FB0;
        }

        .artist-selected-preview strong {
            display: block;
            color: #1e293b;
            font-size: 14px;
        }

        .artist-selected-preview span {
            display: block;
            color: #94a3b8;
            font-size: 11px;
            margin-top: 2px;
        }

        .alert-box {
            padding: 15px 20px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .alert-info {
            background: rgba(59, 130, 246, 0.1);
            color: #1d4ed8;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .alert-warning {
            background: rgba(245, 158, 11, 0.1);
            color: #b45309;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }
    </style>
</head>

<body>
    <div id="navbar"></div>

    <div class="container">

        <div class="card-section hero-average">
            <div class="average-score" id="avg-score">0.0</div>
            <div class="stars-container" id="avg-stars"></div>
            <div class="total-reviews-count" id="total-reviews-text">0 avis publié(s)</div>
        </div>

        <div class="card-section" id="form-section-container">
            <h2 class="section-title" id="form-title">Laisser un avis</h2>
            <div class="catalog-notice">
                Seuls les artistes disposant d'une sortie publiée sur les plateformes peuvent laisser ou modifier un
                avis. Chaque artiste ne peut publier qu'un seul avis.
            </div>
            <div id="form-access-message" class="alert-box alert-info">Vérification de votre éligibilité...</div>

            <form id="review-form" style="display: none;">
                <div class="form-group">
                    <label class="form-label" for="artist-selector">Votre profil d'artiste</label>
                    <select id="artist-selector" class="form-select" style="border-radius: 50px;" required>
                        <option value="">-- Chargement de votre profil --</option>
                    </select>

                    <div id="artist-selected-preview" class="artist-selected-preview" style="display:none;">
                        <img id="selected-artist-avatar" src="/assets/img/icons/pdp.png" alt="">
                        <div>
                            <strong id="selected-artist-name"></strong>
                            <span id="selected-artist-status"></span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Note</label>
                    <div class="star-picker" id="star-picker"></div>
                    <input type="hidden" id="review-rating" value="5" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="review-message">Votre message</label>
                    <textarea id=" review-message" class="form-textarea"
                        placeholder="Ex: Super catalogue, l'équipe est top..." style="border-radius: 24px;"
                        required></textarea>
                </div>

                <button type=" submit" class="submit-btn" id="submit-btn-text">Publier mon avis</button>
            </form>
        </div>

        <div class="card-section">
            <h2 class="section-title">Avis de la communauté</h2>
            <div class="reviews-list" id="reviews-list">
                <p style="color: #64748b; font-size: 14px;">Chargement des avis...</p>
            </div>
        </div>

    </div>

    <script type="module">
        import { auth } from "/assets/js/firebase.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
        import { api } from "/assets/js/api.js";

        let existingReviewsMap = new Map();

        function getRoundedStarSvg(isFilled, customClass = "star-svg") {
            const fillColor = isFilled ? "#FC8FB0" : "none";
            const strokeColor = "#FC8FB0";
            return `<svg class="${customClass} ${isFilled ? 'filled' : ''}" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.5" stroke="${strokeColor}" fill="${fillColor}" rx="2" ry="2"/>
            </svg>`;
        }

        function renderStars(ratingValue) {
            let html = '';
            const starsCount = Math.round(ratingValue);
            for (let i = 1; i <= 5; i++) {
                html += getRoundedStarSvg(i <= starsCount);
            }
            return html;
        }

        function initStarPicker(currentRating = 5) {
            const picker = document.getElementById("star-picker");
            const ratingInput = document.getElementById("review-rating");
            picker.innerHTML = '';

            for (let i = 1; i <= 5; i++) {
                const wrapper = document.createElement("div");
                wrapper.innerHTML = getRoundedStarSvg(i <= currentRating, "star-svg interactive-star");
                const svgEl = wrapper.firstElementChild;

                svgEl.addEventListener("mouseenter", () => {
                    highlightStars(i);
                    gsap.to(svgEl, { scale: 1.2, rotation: 10, duration: 0.3, ease: "back.out(1.5)" });
                });

                svgEl.addEventListener("mouseleave", () => {
                    gsap.to(svgEl, { scale: 1, rotation: 0, duration: 0.2 });
                });

                svgEl.addEventListener("click", () => {
                    ratingInput.value = i;
                    highlightStars(i);
                    gsap.fromTo(svgEl, { scale: 0.5 }, { scale: 1.2, duration: 0.5, ease: "elastic.out(1, 0.3)" });
                });

                picker.appendChild(wrapper);
            }

            // Un seul listener global sur le picker pour éviter les doublons
            picker.onmouseleave = () => {
                highlightStars(parseInt(ratingInput.value, 10));
            };

            highlightStars(currentRating);
        }

        function highlightStars(count) {
            const stars = document.querySelectorAll("#star-picker .star-svg");
            stars.forEach((star, index) => {
                const path = star.querySelector("path");
                if (index < count) {
                    star.classList.add("filled");
                    if (path) path.setAttribute("fill", "#FC8FB0");
                } else {
                    star.classList.remove("filled");
                    if (path) path.setAttribute("fill", "none");
                }
            });
        }

        function normalizeArtistName(name) {
            return String(name || "").trim().toLowerCase();
        }

        function getArtistAvatar(artist, fallbackName = "") {
            if (artist && artist.photo) {
                return api.fileUrl ? api.fileUrl(artist.photo) : artist.photo;
            }

            return `/assets/img/icons/pdp.png`;
        }

        function getReviewId(review) {
            return review?.id || review?._id || review?.reviewId || review?.review_id || null;
        }

        function isReviewOwnedByUser(review, userUid) {
            if (!review || !userUid) return false;
            return String(review.userUid || review.user_uid || review.uid || "") === String(userUid);
        }

        async function sendReviewRequest(method, url, data) {
            // On utilise directement fetch pour pouvoir envoyer PUT lors d'une modification.
            // L'authentification Firebase est déjà gérée par le système existant.
            const response = await fetch(url, {
                method,
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            let result = null;
            try {
                result = await response.json();
            } catch (_) {
                result = null;
            }

            if (!response.ok) {
                const message =
                    result?.error ||
                    result?.message ||
                    `Erreur HTTP ${response.status}`;
                const error = new Error(message);
                error.status = response.status;
                throw error;
            }

            return result;
        }

        function updateSelectedArtistPreview(artistName, artistAvatarsMap, existingReview = null, currentUserUid = null) {
            const preview = document.getElementById("artist-selected-preview");
            const avatar = document.getElementById("selected-artist-avatar");
            const name = document.getElementById("selected-artist-name");
            const status = document.getElementById("selected-artist-status");

            if (!artistName) {
                preview.style.display = "none";
                return;
            }

            const key = normalizeArtistName(artistName);
            const avatarSrc = artistAvatarsMap.get(key) || "/assets/img/icons/pdp.png";

            avatar.src = avatarSrc;
            avatar.onerror = () => {
                avatar.onerror = null;
                avatar.src = "/assets/img/icons/pdp.png";
            };

            name.textContent = artistName;

            if (existingReview) {
                if (isReviewOwnedByUser(existingReview, currentUserUid)) {
                    status.textContent = "Vous avez déjà publié un avis — vous pouvez le modifier.";
                } else {
                    status.textContent = "Cet artiste possède déjà un avis.";
                }
            } else {
                status.textContent = "Aucun avis publié pour cet artiste.";
            }

            preview.style.display = "flex";
        }

        async function initAvisPage() {
            try {
                // Récupération des artistes pour récupérer leur nom et leur PDP.
                const artistsList = await api.get("/api/artists");
                const artistMap = new Map();
                const artistAvatarsMap = new Map();

                if (Array.isArray(artistsList)) {
                    artistsList.forEach(art => {
                        if (!art?.name) return;

                        const key = normalizeArtistName(art.name);
                        artistMap.set(key, art);

                        const avatarUrl = getArtistAvatar(art, art.name);
                        artistAvatarsMap.set(key, avatarUrl);
                    });
                }

                const reviewsList = await api.get("/api/reviews");
                existingReviewsMap.clear();

                let totalScore = 0;
                let reviewCount = 0;
                const reviewsListHtml = [];
                const displayedReviewKeys = new Set();

                if (Array.isArray(reviewsList)) {
                    reviewsList.forEach(rev => {
                        const artistName = (rev.artistName || rev.artist_name || "").trim();
                        if (!artistName) return;

                        const artistKey = normalizeArtistName(artistName);

                        // Même s'il existe accidentellement plusieurs lignes en base,
                        // on n'affiche et ne sélectionne qu'un seul avis par artiste.
                        if (displayedReviewKeys.has(artistKey)) return;
                        displayedReviewKeys.add(artistKey);

                        existingReviewsMap.set(artistKey, rev);

                        const rating = Math.min(5, Math.max(0, Number(rev.rating) || 0));
                        totalScore += rating;
                        reviewCount++;

                        const dateValue = rev.updatedAt || rev.updated_at || rev.createdAt || rev.created_at;
                        const dateFormatted = dateValue
                            ? new Date(dateValue).toLocaleDateString("fr-FR", {
                                day: "numeric",
                                month: "long",
                                year: "numeric"
                            })
                            : "";

                        const artistProfileUrl =
                            `/catalogue/artiste.html?name=${encodeURIComponent(artistName)}`;

                        const avatarSrc =
                            artistAvatarsMap.get(artistKey) ||
                            (rev.artistPhoto || rev.artist_photo
                                ? (api.fileUrl
                                    ? api.fileUrl(rev.artistPhoto || rev.artist_photo)
                                    : (rev.artistPhoto || rev.artist_photo))
                                : "/assets/img/icons/pdp.png");

                        const reviewAuthorUid = rev.userUid || rev.user_uid || rev.uid || "";
                        const reviewId = getReviewId(rev);

                        reviewsListHtml.push(`
                            <div class="review-card" data-artist-key="${escapeHtml(artistKey)}">
                                <div class="review-header">
                                    <div class="review-author-info">
                                        <img
                                            src="${escapeHtml(avatarSrc)}"
                                            alt="${escapeHtml(artistName)}"
                                            class="review-avatar"
                                            onerror="this.onerror=null; this.src='/assets/img/icons/pdp.png';"
                                        >
                                        <div class="author-details">
                                            <a href="${artistProfileUrl}" class="review-author-link">
                                                ${escapeHtml(artistName)}
                                            </a>
                                            ${dateFormatted
                                ? `<span class="review-date">${escapeHtml(dateFormatted)}</span>`
                                : ""}
                                        </div>
                                    </div>
                                    <div class="stars-container">${renderStars(rating)}</div>
                                </div>

                                <p class="review-message">
                                    ${escapeHtml(rev.comment || rev.message || "")}
                                </p>

                                <div class="review-actions" data-review-uid="${escapeHtml(reviewAuthorUid)}" data-review-id="${escapeHtml(reviewId || "")}">
                                    <button
                                        type="button"
                                        class="review-edit-btn"
                                        data-edit-artist="${escapeHtml(artistName)}"
                                        style="display:none;"
                                    >
                                        Modifier mon avis
                                    </button>
                                </div>
                            </div>
                        `);
                    });
                }

                const avgScoreEl = document.getElementById("avg-score");
                const avgStarsEl = document.getElementById("avg-stars");
                const totalTextEl = document.getElementById("total-reviews-text");

                if (reviewCount > 0) {
                    const average = totalScore / reviewCount;
                    avgScoreEl.innerText = average.toFixed(1);
                    avgStarsEl.innerHTML = renderStars(Math.round(average));
                    totalTextEl.innerText = `${reviewCount} avis publié(s)`;
                } else {
                    avgScoreEl.innerText = "0.0";
                    avgStarsEl.innerHTML = renderStars(0);
                    totalTextEl.innerText = "0 avis publié(s)";
                }

                document.getElementById("reviews-list").innerHTML =
                    reviewsListHtml.length > 0
                        ? reviewsListHtml.join("")
                        : `<p style="color:#64748b;font-size:14px;">Aucun avis publié pour le moment.</p>`;

                onAuthStateChanged(auth, async (user) => {
                    const accessMsg = document.getElementById("form-access-message");
                    const reviewForm = document.getElementById("review-form");
                    const artistSelector = document.getElementById("artist-selector");

                    if (!user) {
                        accessMsg.className = "alert-box alert-warning";
                        accessMsg.innerText = "Vous devez être connecté à votre compte pour laisser un avis.";
                        reviewForm.style.display = "none";
                        return;
                    }

                    try {
                        let userArtists = await api.get(`/api/users/${user.uid}/artists`);

                        if (!Array.isArray(userArtists)) {
                            userArtists = [];
                        }

                        // Seuls les artistes réellement liés au compte sont proposés.
                        const eligibleArtists = userArtists.filter(art => art?.name?.trim());

                        if (eligibleArtists.length === 0) {
                            accessMsg.className = "alert-box alert-warning";
                            accessMsg.innerText = "Aucun profil d'artiste n'est rattaché à ce compte.";
                            reviewForm.style.display = "none";
                            return;
                        }

                        accessMsg.style.display = "none";
                        reviewForm.style.display = "block";

                        artistSelector.innerHTML = eligibleArtists.map(art => {
                            const artistName = art.name.trim();
                            return `<option value="${escapeHtml(artistName)}">${escapeHtml(artistName)}</option>`;
                        }).join("");

                        // Les boutons "Modifier" ne sont visibles que pour l'artiste connecté.
                        document.querySelectorAll(".review-edit-btn").forEach(button => {
                            const artistName = button.dataset.editArtist || "";
                            const review = existingReviewsMap.get(normalizeArtistName(artistName));

                            if (review && isReviewOwnedByUser(review, user.uid)) {
                                button.style.display = "inline-flex";
                                button.addEventListener("click", () => {
                                    artistSelector.value = artistName;
                                    triggerArtistSelection(
                                        artistName,
                                        artistAvatarsMap,
                                        user.uid
                                    );
                                    document.getElementById("form-section-container")
                                        .scrollIntoView({ behavior: "smooth", block: "start" });
                                });
                            }
                        });

                        triggerArtistSelection(
                            eligibleArtists[0].name.trim(),
                            artistAvatarsMap,
                            user.uid
                        );

                        artistSelector.addEventListener("change", (e) => {
                            triggerArtistSelection(
                                e.target.value,
                                artistAvatarsMap,
                                user.uid
                            );
                        });

                    } catch (err) {
                        console.error("Erreur profil :", err);
                        accessMsg.className = "alert-box alert-warning";
                        accessMsg.innerText = "Erreur lors de la vérification de votre profil.";
                    }
                });

            } catch (error) {
                console.error("Erreur chargement page :", error);
                document.getElementById("form-access-message").className = "alert-box alert-warning";
                document.getElementById("form-access-message").innerText =
                    "Erreur lors du chargement des données.";
            }
        }

        function triggerArtistSelection(artistName, artistAvatarsMap = new Map(), currentUserUid = null) {
            const selectedName = normalizeArtistName(artistName);
            const submitBtn = document.getElementById("submit-btn-text");
            const formTitle = document.getElementById("form-title");
            const ratingInput = document.getElementById("review-rating");
            const messageTextarea = document.getElementById("review-message");

            const existing = existingReviewsMap.get(selectedName) || null;
            const ownedByCurrentUser = existing
                ? isReviewOwnedByUser(existing, currentUserUid)
                : false;

            updateSelectedArtistPreview(
                artistName,
                artistAvatarsMap,
                existing,
                currentUserUid
            );

            if (existing && ownedByCurrentUser) {
                formTitle.innerText = "Modifier votre avis existant";
                submitBtn.innerText = "Mettre à jour mon avis";
                submitBtn.disabled = false;

                const currentRating = Number(existing.rating) || 5;
                ratingInput.value = currentRating;
                messageTextarea.value = existing.comment || existing.message || "";
                messageTextarea.disabled = false;

                initStarPicker(currentRating);
                return;
            }

            if (existing && !ownedByCurrentUser) {
                formTitle.innerText = "Avis déjà publié";
                submitBtn.innerText = "Avis déjà publié";
                submitBtn.disabled = true;
                ratingInput.value = Number(existing.rating) || 5;
                messageTextarea.value = existing.comment || existing.message || "";
                messageTextarea.disabled = true;

                initStarPicker(Number(existing.rating) || 5);
                document.querySelectorAll("#star-picker .interactive-star").forEach(star => {
                    star.style.pointerEvents = "none";
                    star.style.opacity = "0.7";
                });
                return;
            }

            formTitle.innerText = "Laisser un avis";
            submitBtn.innerText = "Publier mon avis";
            submitBtn.disabled = false;

            ratingInput.value = 5;
            messageTextarea.value = "";
            messageTextarea.disabled = false;

            initStarPicker(5);
        }

        document.getElementById("review-form").addEventListener("submit", async (e) => {
            e.preventDefault();

            const artistName = document.getElementById("artist-selector").value.trim();
            const rating = parseInt(document.getElementById("review-rating").value, 10);
            const comment = document.getElementById("review-message").value.trim();
            const currentUser = auth.currentUser;

            if (!currentUser) {
                alert("Vous devez être connecté.");
                return;
            }

            if (!artistName) {
                alert("Veuillez sélectionner un artiste.");
                return;
            }

            if (!comment) {
                alert("Veuillez écrire un message.");
                return;
            }

            if (rating < 1 || rating > 5) {
                alert("La note doit être comprise entre 1 et 5.");
                return;
            }

            const artistKey = normalizeArtistName(artistName);
            const existing = existingReviewsMap.get(artistKey) || null;
            const ownedByCurrentUser = existing
                ? isReviewOwnedByUser(existing, currentUser.uid)
                : false;

            // Sécurité côté interface : impossible de créer un deuxième avis
            // pour le même artiste. Si l'avis appartient au compte, on le modifie.
            if (existing && !ownedByCurrentUser) {
                alert("Cet artiste possède déjà un avis. Un seul avis est autorisé par artiste.");
                return;
            }

            const submitBtn = document.getElementById("submit-btn-text");
            const originalText = submitBtn.innerText;
            submitBtn.disabled = true;
            submitBtn.innerText = existing ? "Mise à jour..." : "Publication...";

            const reviewData = {
                userUid: currentUser.uid,
                artistName,
                rating,
                comment
            };

            try {
                if (existing && ownedByCurrentUser) {
                    const reviewId = getReviewId(existing);

                    if (!reviewId) {
                        throw new Error(
                            "L'identifiant de l'avis est absent. L'API doit retourner un champ id pour permettre sa modification."
                        );
                    }

                    // Modification de l'avis existant : PUT /api/reviews/:id
                    await sendReviewRequest(
                        "PUT",
                        `/api/reviews/${encodeURIComponent(reviewId)}`,
                        reviewData
                    );

                    alert("Votre avis a bien été modifié !");
                } else {
                    // Nouvelle publication uniquement si aucun avis n'existe pour cet artiste.
                    await sendReviewRequest("POST", "/api/reviews", reviewData);

                    alert("Votre avis a bien été publié !");
                }

                window.location.reload();

            } catch (error) {
                console.error("Erreur enregistrement avis :", error);

                if (error.status === 409) {
                    alert("Un avis existe déjà pour cet artiste. Vous pouvez modifier uniquement votre propre avis.");
                } else if (error.status === 404 || error.status === 405) {
                    alert(
                        "La modification n'est pas encore disponible côté API. " +
                        "Ajoute la route PUT /api/reviews/:id sur ton serveur."
                    );
                } else {
                    alert(error.message || "Une erreur est survenue lors de l'enregistrement.");
                }

                submitBtn.disabled = false;
                submitBtn.innerText = originalText;
            }
        });

        function escapeHtml(str) {
            if (str === null || str === undefined) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        initAvisPage();
    </script>
</body>

<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Morgann Music CP</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <header class="header">
        <div class="logo-block">
            <img src="icon-48.png" alt="MMCP" class="logo-img">
            <span class="brand-title">Morgann Music CP</span>
        </div>
        <a href="https://mm-cp.uk/portail/" target="_blank" class="btn-portal">Portail Web ↗</a>
    </header>

    <section id="auth-screen" class="auth-container">
        <h2 class="auth-title">Connexion</h2>
        <form id="login-form" style="display:flex; flex-direction:column; gap:12px;">
            <input type="email" id="email" class="auth-input" placeholder="ton-email@domaine.com" required>
            <input type="password" id="password" class="auth-input" placeholder="••••••••" required>
            <button type="submit" class="btn-submit" id="btn-login">Se connecter</button>
        </form>

        <button type="button" id="btn-google" class="btn-submit"
            style="background:#fff; color:#1e293b; border:1px solid #cbd5e1; display:flex; align-items:center; justify-content:center; gap:8px;">
            Connexion via le portail web
        </button>

        <div id="auth-error" style="display:none; color:red; font-size:12px; text-align:center;"></div>
    </section>

    <section id="app-screen" style="display:none; flex-direction:column;">
        <div class="user-card">
            <div class="user-avatar" id="user-avatar-initial">M</div>
            <div class="user-info">
                <div class="user-name" id="user-display-name">Artiste</div>
                <div class="user-email" id="user-display-email">email@mm-cp.uk</div>
            </div>
            <button id="btn-logout" class="btn-logout" title="Déconnexion">🚪</button>
        </div>

        <nav class="nav-tabs">
            <button class="tab-btn active" data-tab="releases">Dernières Sorties</button>
            <button class="tab-btn" data-tab="notifs">Notifications <span id="notif-badge" class="notif-badge"
                    style="display:none;">0</span></button>
        </nav>

        <div id="tab-releases" class="tab-content active">
            <h3 style="font-size:12px; margin-bottom:12px;">5 Dernières sorties</h3>
            <div id="releases-list" class="releases-grid">
                <p class="empty-text">Chargement...</p>
            </div>
        </div>

        <div id="tab-notifs" class="tab-content">
            <div class="notifs-header-actions">
                <button id="btn-read-all" class="btn-read-all">Tout marquer comme lu</button>
            </div>
            <div id="notifs-list" class="notifs-list">
                <p class="empty-text">Chargement...</p>
            </div>
        </div>
    </section>

    <script src="popup.js"></script>
</body>

</html>
